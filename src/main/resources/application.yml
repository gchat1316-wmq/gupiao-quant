server:
  port: 8080
  servlet:
    context-path: /gp
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: gupiao-quant
  datasource:
    url: jdbc:mysql://43.140.208.165:3306/wucai_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:wmq534@126.com}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false
  mvc:
    static-path-pattern: /**
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

app:
  upload-dir: uploads

baostock-sync:
  enabled: true
  startup-enabled: false
  startup-days-back: 45
  daily-days-back: 7
  daily-cron: "0 20 18 * * MON-FRI"
  python-command: python3
  timeout-seconds: 1800

# 个股分析模块 (紫苏叶/高景气九维)
# 多个 API Key 以逗号分隔。生成随机 Key: openssl rand -hex 16
stock-analysis:
  enabled: true
  api-keys: ${STOCK_ANALYSIS_API_KEYS:wmq-gp-secret-2026,wmq-local-debug}
  # 优先用环境变量覆盖，默认走项目内 scripts/baostock_client.py (相对路径以项目根为 CWD)
  python-script: ${BAOSTOCK_CLIENT_SCRIPT:scripts/baostock_client.py}
  python-command: ${BAOSTOCK_CLIENT_PYTHON:python3}
  timeout-seconds: 90

prosperity-strong:
  enabled: true
  cron: "0 30 15 * * MON-FRI"
  provider: local
  max-sectors: 5
  leaders-per-sector: 5
  max-candidates: 15
  ai:
    enabled: true
    fallback-to-mock: true
  source:
    sector: eastmoney
    timeout-seconds: 15
  wind:
    skill-dir: ${WIND_SKILL_DIR:${user.home}/.agents/skills/wind-mcp-skill}
    config-path: ${WIND_CONFIG_PATH:${user.home}/.wind-aifinmarket/config}
    timeout-seconds: 15
  tdx:
    enabled: false
    connector-dir: ${TDX_CONNECTOR_DIR:${user.home}/.workbuddy/connectors-marketplace/connectors/tdx-connector}
    mcp-url: ${TDX_MCP_URL:https://txmcp.tdx.com.cn:3001/txmcp}

invest-big-yang:
  enabled: true
  startup-enabled: true
  min-streak-days: 1
  max-streak-days: 2
  candidate-lookback-days: 20
  pullback-tolerance-pct: 2.00
  invalid-break-pct: 5.00
  expire-trading-days: 20
  max-signals: 200
  candidate-cron: "0 35 18 * * MON-FRI"
  trigger-cron: "0 */5 9-15 * * MON-FRI"

notification:
  serverchan:
    enabled: true
    send-key: ${SERVER_CHAN_SEND_KEY:SCT354970T4GcZL9UbymUFDnOnhn0z4Y8C}
    base-url: https://sctapi.ftqq.com
    timeout-seconds: 10
  quote-monitor:
    enabled: false
    pool-type: tech_ai
    require-trading-time: true
    cooldown-minutes: 10
    daily-dedupe: true
    cron: "0 */1 9-15 * * MON-FRI"
  wish-pool:
    enabled: true
    webhook-url: ${WISH_POOL_FEISHU_WEBHOOK_URL:https://open.feishu.cn/open-apis/bot/v2/hook/a4c6882a-b4f9-438f-ad58-5f150b2730e3}
    timeout-seconds: 10

ai:
  fallback-to-mock: true            # AI 调用失败时是否回退到 mock 数据
  minimax:
    enabled: true                  # 填入 api-key 后改为 true
    base-url: https://api.minimaxi.com/anthropic/v1
    api-key: ${AI_MINIMAX_KEY:4SzPnZuXeVOtJayrrdEACoxKWZ6npFsdClX5sAGQp3Rhk}       # 环境变量 AI_MINIMAX_KEY
    group-id: ""                    # 可选: 部分账号需要 group id
    model: MiniMax-M2.7-highspeed       # 可改为 abab6.5s-chat 等其它型号
    timeout-seconds: 90
    max-input-chars: 8000           # 送入模型的资料文本最大字符数
  sensenova:
    enabled: true                  # 填入 api-key 后改为 true
    base-url: https://token.sensenova.cn/v1
    api-key: ${SENSENOVA_API_KEY:${AI_SENSENOVA_KEY:sk-tNFEPGZZeyZqNDn13ma3BbJzkdFqzJX8}}     # 环境变量 SENSENOVA_API_KEY / AI_SENSENOVA_KEY
    image-model: sensenova-u1-fast
    chat-model: deepseek-v4-flash   # 用于 AI 详解文本生成
    image-size: "2752x1536"
    timeout-seconds: 120
  tavily:
    enabled: true
    base-url: https://api.tavily.com
    api-key: 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
    timeout-seconds: 30
    max-results: 5

logging:
  level:
    root: INFO
    com.quant: INFO
