<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识点学习 · 学习搭子</title>
  <base href="/gp/" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/study.css" />
</head>
<body>
  <header class="top-nav">
    <div class="nav-inner">
      <a href="./" class="brand"><span class="brand-mark">🐾</span><span class="brand-name">量化学习助手</span></a>
      <nav class="nav-links">
        <a href="./" class="nav-link">财务分析</a>
        <a href="invest.html" class="nav-link">龙江投资</a>
        <a href="study.html" class="nav-link active">学习搭子</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-toolbar">
      <a href="javascript:history.back()" class="toolbar-back">‹ 返回</a>
      <span class="toolbar-title" id="crumb"></span>
    </div>

    <div class="node-page">
      <div class="panel">
        <div class="panel-title">知识图谱</div>
        <div class="mindmap-wrap" id="mindmap"></div>
      </div>
      <div class="panel node-content" style="overflow:auto;">
        <div class="breadcrumb" id="breadcrumb"></div>
        <h2 id="nodeTitle">加载中...</h2>
        <div class="section-head">内容概述</div>
        <div id="summary" style="font-size:13px;line-height:1.7;color:#374151;"></div>
        <div class="section-head" style="margin-top:16px;">定义</div>
        <div id="definition" style="font-size:13px;line-height:1.7;color:#374151;"></div>

        <div id="cardArea" style="margin-top:20px;">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-weight:700;font-size:15px;">知识卡片</span>
            <button class="next-step-btn" id="quizBtn">小测一下 ›</button>
          </div>
          <div id="overview" style="font-size:13px;color:#374151;margin-top:8px;line-height:1.7;"></div>
          <div class="card-tabs" style="margin-top:14px;">
            <button class="card-tab active" data-tab="ai">AI详解</button>
            <button class="card-tab" data-tab="flash">知识闪卡<span class="beta">beta</span></button>
            <span style="margin-left:auto;color:#9ca3af;font-size:12px;" id="flashTotal"></span>
          </div>
          <div id="aiPane" class="card-pane"></div>
          <div id="flashPane" class="card-pane" style="display:none;"></div>
          <div id="noCardHint" style="display:none;text-align:center;padding:20px;color:#9ca3af;">
            <div style="font-size:28px;margin-bottom:8px;">🗂️</div>
            <div style="font-size:14px;margin-bottom:12px;">暂无知识卡片</div>
            <button class="btn-primary-dark" id="genCardBtn">生成卡片</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/mindmap.js"></script>
  <script src="js/node.js"></script>
</body>
</html>
