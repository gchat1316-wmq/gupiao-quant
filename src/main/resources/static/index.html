<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e88ff" />
  <title>财务分析 · 量化学习助手</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/study.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="top-nav">
    <div class="nav-inner">
      <a href="/" class="brand">
        <span class="brand-mark">🐾</span>
        <span class="brand-name">量化学习助手</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link active">财务分析</a>
        <a href="/invest.html" class="nav-link">龙江投资</a>
        <a href="/study.html" class="nav-link">学习搭子</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">股票财务数据查询</h1>

    <section class="search-bar">
      <div class="search-input-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9aa4b2" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <circle cx="9" cy="11" r="2" />
            <path d="M21 17l-5-5-4 4-3-3-6 6" />
          </svg>
        </span>
        <input id="searchInput" type="text" inputmode="search" autocomplete="off"
               placeholder="贵州茅台,佰维存储" value="贵州茅台,佰维存储" />
        <button id="clearBtn" class="clear-btn" aria-label="清除">×</button>
      </div>
      <button id="queryBtn" class="primary-btn">查询</button>
    </section>

    <section id="resultSection" class="result-section hidden">
      <h2 class="section-title">核心财务指标对比分析</h2>
      <p class="section-subtitle" id="subtitle"></p>

      <div id="tablesWrap" class="tables-wrap"></div>

      <div class="indicator-wrap">
        <div class="indicator-label">指标</div>
        <div class="indicator-tabs" id="indicatorTabs">
          <button class="tab active" data-key="grossMargin">毛利率</button>
          <button class="tab" data-key="revenueYoy">营收同比</button>
          <button class="tab" data-key="deductedNetProfitYoy">扣非同比</button>
          <button class="tab" data-key="deductedNetProfitTtm">扣非TTM</button>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-title" id="chartTitle">毛利率多股对比图</div>
        <div class="chart-canvas-wrap">
          <canvas id="metricChart"></canvas>
        </div>
      </div>

      <div class="footer">
        <button id="downloadBtn" class="primary-btn wide">下载图表(免费)</button>
      </div>
    </section>

    <section id="emptyHint" class="empty-hint">
      <p>输入股票名称或代码,多个用逗号分隔,例如:<code>贵州茅台,600519</code></p>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
