<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · 投资助手</title>
  <base href="/gp/" />
  <link rel="stylesheet" href="css/skin.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/study.css?v=20260701-feed-merge" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --sidebar-w: 220px;
      --sidebar-bg: #0f172a;
      --sidebar-item-hover: rgba(255,255,255,0.08);
      --sidebar-item-active: rgba(59,130,246,0.25);
      --sidebar-text: #94a3b8;
      --sidebar-text-active: #fff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: var(--bg); overflow-x: hidden; }

    /* ── 整体 Layout ─────────────────────────────── */
    .admin-layout {
      display: flex;
      min-height: 100vh;
    }

    /* ── 左侧 Sidebar ─────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--sidebar-bg);
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      z-index: 100;
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: 20px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-brand-sub {
      font-size: 12px;
      color: var(--sidebar-text);
      margin-top: 4px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 0;
    }
    .sidebar-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.3);
      padding: 12px 20px 6px;
      text-transform: uppercase;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--sidebar-text);
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
      user-select: none;
    }
    .sidebar-item:hover {
      background: var(--sidebar-item-hover);
      color: var(--sidebar-text-active);
    }
    .sidebar-item.active {
      background: var(--sidebar-item-active);
      color: #60a5fa;
      border-left-color: #3b82f6;
    }
    .sidebar-item .badge {
      margin-left: auto;
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 10px;
      line-height: 16px;
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--sidebar-text);
    }
    .sidebar-user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(59,130,246,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #60a5fa;
      flex-shrink: 0;
    }
    .sidebar-user-info { flex: 1; min-width: 0; }
    .sidebar-user-name { color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-user-role { font-size: 11px; color: var(--sidebar-text); }
    .sidebar-back {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      font-size: 13px;
      color: var(--sidebar-text);
      text-decoration: none;
      transition: color 0.15s;
    }
    .sidebar-back:hover { color: #fff; }

    /* ── 右侧主内容区 ─────────────────────────────── */
    .admin-main {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 28px 32px;
      min-width: 0;
    }
    .page-header {
      margin-bottom: 28px;
    }
    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }
    .page-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── 面板通用 ─────────────────────────────── */
    .panel { display: none; }
    .panel.active { display: block; }
    .admin-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .admin-section-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }

    /* ── 用户管理 ─────────────────────────────── */
    .user-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .user-table th { text-align: left; color: var(--text-muted); padding: 8px 10px; border-bottom: 2px solid var(--border); font-weight: 500; white-space: nowrap; }
    .user-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .user-table tr:last-child td { border-bottom: none; }
    .user-table tr.disabled-row td { opacity: 0.5; }
    .avatar-cell { width: 36px; }
    .avatar-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--border); }
    .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .role-badge.ADMIN { background: #e53; color: #fff; }
    .role-badge.MANAGER { background: var(--primary); color: #fff; }
    .role-badge.USER { background: var(--border); color: var(--text-muted); }
    .role-badge.DISABLED { background: #888; color: #fff; }
    .role-select { padding: 3px 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 12px; }
    .notify-badges { display: flex; gap: 4px; flex-wrap: wrap; }
    .notify-chip { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 500; }
    .notify-chip.on { background: #dcfce7; color: #166534; }
    .notify-chip.off { background: var(--border); color: var(--text-muted); }
    .btn-sm { padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 12px; color: var(--text); }
    .btn-sm:hover { background: var(--hover-bg); }
    .btn-sm.danger { border-color: #e53; color: #e53; }
    .btn-sm.danger:hover { background: #e53; color: #fff; }
    .btn-sm.success { border-color: #22c55e; color: #22c55e; }
    .btn-sm.success:hover { background: #22c55e; color: #fff; }
    .gen-code-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .form-field { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 13px; font-weight: 500; color: var(--text); }
    .form-input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: var(--surface); color: var(--text); }
    .primary-btn { padding: 6px 16px; border-radius: 6px; border: none; background: var(--primary); color: #fff; cursor: pointer; font-size: 14px; }
    .primary-btn:hover { opacity: 0.9; }
    .gen-result { margin-top: 12px; padding: 12px; background: #f0f9ff; border: 1px solid #b3d8fd; border-radius: 8px; font-size: 14px; }
    .gen-result code { font-size: 16px; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
    .msg { font-size: 13px; margin-top: 6px; }
    .msg.ok { color: #22c55e; }
    .msg.err { color: #e53; }
    .expand-btn { font-size: 11px; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border); cursor: pointer; background: transparent; color: var(--text-muted); }
    .expand-btn:hover { background: var(--hover-bg); }
    .notify-edit-row { display: none; background: #f8fafc; }
    .notify-edit-row td { padding: 12px 16px; }
    .notify-toggle-group { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .notify-toggle-item { display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .notify-toggle-item input { cursor: pointer; }
    .inline-actions { display: flex; gap: 4px; align-items: center; }
    .stat-bar { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat-item { font-size: 13px; color: var(--text-muted); }
    .stat-item span { font-weight: 600; color: var(--text); }

    /* ── 数据统计面板 ──────────────────────────────── */
    .stats-kpi-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; transition: border-color 0.2s; }
    .kpi-card:hover { border-color: var(--primary); }
    .kpi-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; white-space: nowrap; }
    .kpi-value { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1.2; }
    .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .kpi-card.blue { border-color: rgba(59,130,246,0.3); }
    .kpi-card.blue .kpi-value { color: #3b82f6; }
    .kpi-card.orange { border-color: rgba(245,158,11,0.3); }
    .kpi-card.orange .kpi-value { color: #f59e0b; }
    .kpi-card.green { border-color: rgba(34,197,94,0.3); }
    .kpi-card.green .kpi-value { color: #22c55e; }
    .stats-chart-wrap { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .stats-chart { height: 220px; }
    .stats-chart canvas { width: 100% !important; height: 220px !important; }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .stats-table th { text-align: left; color: var(--text-muted); padding: 8px 10px; border-bottom: 2px solid var(--border); font-weight: 500; }
    .stats-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .stats-table tr:last-child td { border-bottom: none; }
    .stats-table .rank { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; font-weight: 700; background: var(--border); color: var(--text-muted); flex-shrink: 0; }
    .stats-table tr:nth-child(1) .rank { background: #fbbf24; color: #fff; }
    .stats-table tr:nth-child(2) .rank { background: #94a3b8; color: #fff; }
    .stats-table tr:nth-child(3) .rank { background: #cd7c2f; color: #fff; }
    .duration-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; min-width: 100px; }
    .duration-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .duration-fill { height: 100%; background: var(--primary); border-radius: 2px; }
    .date-range { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .date-range input, .date-range select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-size: 13px; }
    .section-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); }

    /* ── 投资池说明面板 ──────────────────────────── */
    .poolmeta-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .poolmeta-tab { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .poolmeta-tab:hover { border-color: var(--primary); color: var(--primary); }
    .poolmeta-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .poolmeta-field { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border-top: 1px dashed var(--border); }
    .poolmeta-field:first-of-type { border-top: none; padding-top: 4px; }
    .poolmeta-md-hint { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
    .poolmeta-md-textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 1.55; width: 100%; max-width: 100%; min-height: 160px; padding: 10px 12px; resize: vertical; }
    .poolmeta-actions { display: flex; gap: 10px; align-items: center; margin-top: 4px; }

    .poolmeta-cover-row { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
    .poolmeta-cover-preview { width: 240px; height: 135px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); }
    .poolmeta-cover-meta { font-size: 12px; color: var(--text-muted); margin-top: 6px; word-break: break-all; }

    /* ── 投资金句面板 ──────────────────────────────────────── */
    .quote-admin-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .quote-admin-tab { padding: 8px 16px; border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
    .quote-admin-tab:hover { color: var(--text); }
    .quote-admin-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .quote-admin-pane { padding-top: 8px; }
    .quote-admin-form { display: flex; flex-wrap: wrap; gap: 14px; }
    .quote-admin-form .form-field { flex: 1 1 calc(50% - 7px); min-width: 220px; }
    .quote-admin-actions { flex: 1 1 100%; display: flex; gap: 12px; align-items: center; margin-top: 4px; }
    .form-hint-inline { font-weight: 400; color: var(--text-muted); font-size: 12px; margin-left: 6px; }
    .quote-admin-tag-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 0; }
    .quote-admin-tag-custom-row { margin-top: 6px; }
    .quote-admin-tag-custom-row .form-input { max-width: 280px; }
    .quote-admin-toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
    .quote-admin-toolbar .form-input { max-width: 360px; }
    .quote-admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .quote-admin-table th { text-align: left; color: var(--text-muted); padding: 8px 10px; border-bottom: 2px solid var(--border); font-weight: 500; white-space: nowrap; }
    .quote-admin-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .quote-admin-table tr:last-child td { border-bottom: none; }
    .quote-admin-cell-content { line-height: 1.5; color: var(--text); }
    .quote-admin-cell-tags { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
    .quote-tag-mini { display: inline-block; padding: 1px 7px; border-radius: 3px; background: rgba(59,130,246,0.15); color: #60a5fa; font-size: 11px; }
    .quote-admin-pager { display: flex; align-items: center; gap: 12px; margin-top: 12px; justify-content: flex-end; }
    .quote-admin-page-info { font-size: 12px; color: var(--text-muted); }

    .quote-tag-chip { display: inline-block; padding: 4px 10px; border-radius: 999px; background: var(--border); color: var(--text); font-size: 12px; cursor: pointer; user-select: none; transition: all 0.12s; }
    .quote-tag-chip:hover { background: var(--hover-bg); }
    .quote-tag-chip.selected { background: rgba(59,130,246,0.2); color: #60a5fa; border: 1px solid rgba(59,130,246,0.4); }
    .quote-tag-chip.custom.selected { background: rgba(245,158,11,0.2); color: #f59e0b; border-color: rgba(245,158,11,0.4); }

    .poolmeta-9grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 4px; }
    .poolmeta-slot-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: var(--bg); }
    .poolmeta-slot-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .poolmeta-slot-no { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; }
    .poolmeta-slot-card select { width: 100%; font-size: 12px; margin-bottom: 6px; }
    .poolmeta-slot-card input { width: 100%; font-size: 12px; }
    .poolmeta-slot-empty { color: var(--text-muted); font-size: 12px; padding: 14px 4px; text-align: center; }

    .poolmeta-slot-row { display: flex; gap: 4px; margin-bottom: 4px; }
    .poolmeta-slot-row input { font-size: 12px; }
    .poolmeta-slot-row .poolmeta-slot-code { flex: 0 0 110px; }
    .poolmeta-slot-row .poolmeta-slot-name { flex: 1; }
    .poolmeta-slot-img { margin-top: 6px; padding: 6px; border: 1px dashed var(--border); border-radius: 6px; background: rgba(255,255,255,0.02); }
    .poolmeta-slot-img-preview { display: none; margin-bottom: 6px; }
    .poolmeta-slot-img-preview.has-image { display: block; }
    .poolmeta-slot-img-preview img { max-width: 100%; max-height: 140px; border-radius: 4px; cursor: zoom-in; display: block; }
    .poolmeta-slot-img-actions { display: flex; gap: 6px; align-items: center; }
    .poolmeta-slot-img-btn { font-size: 11px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); cursor: pointer; }
    .poolmeta-slot-img-btn:hover { background: var(--hover-bg); }
    .poolmeta-slot-img-btn.danger { color: #f87171; border-color: rgba(248,113,113,0.3); }
    .poolmeta-slot-img-msg { font-size: 11px; color: var(--text-muted); margin-left: auto; }
    .poolmeta-slot-img-msg.err { color: #f87171; }
    .poolmeta-slot-img-msg.ok { color: #34d399; }
    .poolmeta-img-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 9999; cursor: zoom-out; }
    .poolmeta-img-modal.open { display: flex; }
    .poolmeta-img-modal img { max-width: 95vw; max-height: 95vh; border-radius: 6px; }

    /* ===== 股票池管理面板 ===== */
    .poolcrud-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 12px; }
    .poolcrud-tab {
      padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
    }
    .poolcrud-tab:hover { border-color: var(--primary); color: var(--primary); }
    .poolcrud-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .poolcrud-tab .poolcrud-count { font-size: 11px; opacity: 0.8; }

    .poolcrud-toolbar {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px;
      padding: 10px 12px; background: var(--surface); border-radius: 8px;
      border: 1px solid var(--border);
    }
    .poolcrud-search {
      flex: 0 0 240px; padding: 6px 10px; font-size: 13px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text);
    }
    .poolcrud-count-label { margin-left: auto; font-size: 12px; color: var(--text-muted); }

    .poolcrud-table-wrap {
      overflow-x: auto; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface);
    }
    .poolcrud-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .poolcrud-table thead th {
      background: var(--bg); padding: 8px 10px; text-align: left; font-weight: 600;
      color: var(--text); border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .poolcrud-table tbody td {
      padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text);
      vertical-align: middle;
    }
    .poolcrud-table tbody tr:last-child td { border-bottom: none; }
    .poolcrud-table tbody tr.poolcrud-dragging { opacity: 0.4; }
    .poolcrud-table tbody tr.poolcrud-drop-before { box-shadow: inset 0 2px 0 0 var(--primary); }
    .poolcrud-table tbody tr.poolcrud-drop-after { box-shadow: inset 0 -2px 0 0 var(--primary); }

    .poolcrud-drag { cursor: grab; color: var(--text-muted); user-select: none; font-size: 16px; width: 28px; text-align: center; }
    .poolcrud-drag:active { cursor: grabbing; }
    .poolcrud-order { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-muted); width: 40px; text-align: center; }
    .poolcrud-code { font-family: ui-monospace, monospace; font-weight: 600; white-space: nowrap; }
    .poolcrud-name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .poolcrud-valuation { white-space: nowrap; font-size: 12px; }
    .poolcrud-valuation .val-low { color: #34d399; margin-right: 6px; }
    .poolcrud-valuation .val-mid { color: var(--text); margin-right: 6px; }
    .poolcrud-valuation .val-high { color: #f87171; }
    .poolcrud-target { font-family: ui-monospace, monospace; }
    .poolcrud-memo { max-width: 220px; cursor: text; }
    .poolcrud-memo:hover { background: var(--hover-bg); }
    .poolcrud-memo-input {
      width: 100%; min-height: 36px; padding: 4px 6px; font-size: 12px; line-height: 1.4;
      border: 1px solid var(--primary); border-radius: 4px; resize: vertical; font-family: inherit;
    }
    .poolcrud-status { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .poolcrud-actions { white-space: nowrap; }
    .poolcrud-actions .btn-sm { margin-right: 4px; }
    .poolcrud-empty { padding: 36px 12px; text-align: center; color: var(--text-muted); font-size: 13px; }

    .poolcrud-help {
      margin-top: 10px; padding: 8px 12px; font-size: 12px; color: var(--text-muted);

    .modal-mask {

    .modal {

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;

    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-close {

    .modal-footer {

    @media (max-width: 768px) {

    /* ── 响应式 ────────────────────────────────── */

      .poolcrud-search { flex: 1 1 auto; }

      .stats-row { grid-template-columns: 1fr; }

    // ── Sidebar 导航 ───────────────────────────────────────
    document.querySelectorAll('.sidebar-item').forEach(function(item) {
      item.addEventListener('click', function() {
        document.querySelectorAll('.sidebar-item').forEach(function(i) { i.classList.remove('active'); });

        item.classList.add('active');

        if (panel) panel.classList.add('active');

        if (item.dataset.panel === 'stats' && !window._statsLoaded) {
          window._statsLoaded = true;
          initStats();
        }
        if (item.dataset.panel === 'poolmeta' && !window._poolMetaLoaded) {
          window._poolMetaLoaded = true;
          initPoolMetaPanel();
        }

          window._quoteAdminLoaded = true;
          initQuoteAdminPanel();

    // 默认显示今天日期
    var todayStr = new Date().toISOString().slice(0, 10);
    var dateInput = document.getElementById('statsDate');

    if (rangeSelect) rangeSelect.addEventListener('change', function() { loadTrend(); });
    var loadBtn = document.getElementById('loadStatsBtn');
    if (loadBtn) loadBtn.addEventListener('click', function() { loadStats(); loadTrend(); });
    if (dateInput) dateInput.addEventListener('change', function() { loadStats(); });

    // ── 生成登录码 ─────────────────────────────────────────
    document.getElementById('genBtn').addEventListener('click', async function () {
      var role = document.getElementById('genRole').value;
      var days = parseInt(document.getElementById('genDays').value) || 7;
      var btn = this; btn.disabled = true; btn.textContent = '生成中…';
      var resultDiv = document.getElementById('genResult');
      var msgDiv = document.getElementById('genMsg');
      resultDiv.classList.add('hidden'); msgDiv.textContent = ''; msgDiv.className = 'msg';
      try {
        var r = await fetch('/gp/api/auth/admin/login-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ role: role, expireDays: days })
        });
        var data = await r.json();
        if (data.error) { msgDiv.textContent = '错误: ' + data.error; msgDiv.classList.add('err'); }
        else {
          resultDiv.innerHTML = '登录码生成成功！将此码发给对应人员：<br><code>' + data.code + '</code>';
          resultDiv.classList.remove('hidden');
          loadUsers();
        }
      } catch (e) { msgDiv.textContent = '网络错误'; msgDiv.classList.add('err'); }
      finally { btn.disabled = false; btn.textContent = '生成登录码'; }
    });

    // ── 用户列表 ────────────────────────────────────────────
    async function loadUsers() {
      var tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:20px">加载中…</td></tr>';
      try {
        var r = await fetch('/gp/api/auth/admin/users', { headers: { 'Authorization': 'Bearer ' + token } });
        if (r.status === 403 || r.status === 401) { tbody.innerHTML = '<tr><td colspan="7" style="color:#e53">权限不足</td></tr>'; return; }
        var users = await r.json();
        updateUserStats(users);
        tbody.innerHTML = '';
        users.forEach(function(u) {
          var isDisabled = u.disabled === true;
          var avatar = u.avatarUrl
            ? '<img class="avatar-img" src="' + esc(u.avatarUrl) + '" alt="头像" onerror="this.style.display=\'none\'">'
            : '<div class="avatar-img" style="display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-muted)">👤</div>';
          var notifyChips = makeNotifyChips(u);
          tbody.innerHTML +=
            '<tr class="' + (isDisabled ? 'disabled-row' : '') + '" id="user-row-' + u.id + '">' +
              '<td class="avatar-cell">' + avatar + '</td>' +
              '<td>' + u.id + '</td>' +
              '<td><div style="font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(u.username || '—') + '</div><div style="font-size:12px;color:var(--text-muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(u.phone || '—') + '</div></td>' +
              '<td><select class="role-select" id="role-' + u.id + '">' +
                '<option value="ADMIN"' + (u.role==='ADMIN'?' selected':'') + '>ADMIN</option>' +
                '<option value="MANAGER"' + (u.role==='MANAGER'?' selected':'') + '>MANAGER</option>' +
                '<option value="USER"' + (u.role==='USER'?' selected':'') + '>USER</option>' +
              '</select></td>' +
              '<td><div class="notify-badges" id="notify-' + u.id + '">' + notifyChips + '</div></td>' +
              '<td>' + (isDisabled ? '<span class="role-badge DISABLED">已禁用</span>' : '<span class="notify-chip on">正常</span>') + '</td>' +
              '<td class="inline-actions">' +
                '<button class="btn-sm save-role-btn" data-id="' + u.id + '">💾</button>' +
                (isDisabled
                  ? '<button class="btn-sm success enable-btn" data-id="' + u.id + '">启用</button>'
                  : '<button class="btn-sm danger disable-btn" data-id="' + u.id + '">禁用</button>'
                ) +
                '<button class="expand-btn" onclick="toggleNotifyEdit(' + u.id + ')">⚙</button>' +
              '</td>' +
            '</tr>' +
            '<tr class="notify-edit-row" id="notify-edit-' + u.id + '">' +
              '<td colspan="7">' +
                '<div style="font-size:13px;font-weight:600;margin-bottom:8px;">编辑通知偏好: ' + esc(u.username || u.phone || u.id) + '</div>' +
                '<div class="notify-toggle-group">' +
                  '<label class="notify-toggle-item"><input type="checkbox" id="nw-' + u.id + '" ' + (u.notifyWechat?'checked':'') + '> 💬 微信</label>' +
                  '<label class="notify-toggle-item"><input type="checkbox" id="ns-' + u.id + '" ' + (u.notifySms?'checked':'') + '> 📱 短信</label>' +
                  '<label class="notify-toggle-item"><input type="checkbox" id="np-' + u.id + '" ' + (u.notifyPhone?'checked':'') + '> 📞 电话</label>' +
                  '<button class="btn-sm" onclick="saveNotify(' + u.id + ')">保存</button>' +
                  '<button class="btn-sm" onclick="toggleNotifyEdit(' + u.id + ')">收起</button>' +
                '</div>' +
              '</td>' +
            '</tr>';
        });
        // 绑定按钮
        tbody.querySelectorAll('.save-role-btn').forEach(function(b) {
          b.addEventListener('click', async function() {
            var id = this.dataset.id;
            var sel = document.getElementById('role-' + id);
            var msgEl = document.getElementById('listMsg');
            var r = await fetch('/gp/api/auth/admin/users/' + id + '/role', {
              method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
              body: JSON.stringify({ role: sel.value })
            });
            var res = await r.json();
            msgEl.textContent = res.error ? res.error : '已更新为 ' + roleName(sel.value);
            msgEl.className = 'msg ' + (res.error ? 'err' : 'ok');
            if (!res.error) loadUsers();
          });
        });
        tbody.querySelectorAll('.disable-btn').forEach(function(b) {
          b.addEventListener('click', async function() {
            var id = this.dataset.id;
            var msgEl = document.getElementById('listMsg');
            var r = await fetch('/gp/api/auth/admin/users/' + id + '/disabled', {
              method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
              body: JSON.stringify({ disabled: true })
            });
            var res = await r.json();
            msgEl.textContent = res.error ? res.error : '用户已禁用';
            msgEl.className = 'msg ' + (res.error ? 'err' : 'ok');
            if (!res.error) loadUsers();
          });
        });
        tbody.querySelectorAll('.enable-btn').forEach(function(b) {
          b.addEventListener('click', async function() {
            var id = this.dataset.id;
            var msgEl = document.getElementById('listMsg');
            var r = await fetch('/gp/api/auth/admin/users/' + id + '/disabled', {
              method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
              body: JSON.stringify({ disabled: false })
            });
            var res = await r.json();
            msgEl.textContent = res.error ? res.error : '用户已启用';
            msgEl.className = 'msg ' + (res.error ? 'err' : 'ok');
            if (!res.error) loadUsers();
          });
        });
      } catch (e) { tbody.innerHTML = '<tr><td colspan="7" style="color:#e53">加载失败: ' + e.message + '</td></tr>'; }
    }

    window.toggleNotifyEdit = function(id) {
      var row = document.getElementById('notify-edit-' + id);
      row.style.display = row.style.display === 'table-row' ? 'none' : 'table-row';
    };

    window.saveNotify = async function(id) {
      var nw = document.getElementById('nw-' + id).checked;
      var ns = document.getElementById('ns-' + id).checked;
      var np = document.getElementById('np-' + id).checked;
      var msgEl = document.getElementById('listMsg');
      try {
        var r = await fetch('/gp/api/auth/admin/users/' + id + '/notify', {
          method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ notifyWechat: nw, notifySms: ns, notifyPhone: np })
        });
        var res = await r.json();
        if (res.error) { msgEl.textContent = res.error; msgEl.className = 'msg err'; }
        else {
          msgEl.textContent = '通知偏好已更新'; msgEl.className = 'msg ok';
          document.getElementById('notify-' + id).innerHTML = makeNotifyChips(res);
          toggleNotifyEdit(id);
        }
      } catch (e) { msgEl.textContent = '保存失败'; msgEl.className = 'msg err'; }
    };

    function makeNotifyChips(u) {
      return '<span class="notify-chip ' + (u.notifyWechat ? 'on' : 'off') + '">💬</span>' +
             '<span class="notify-chip ' + (u.notifySms ? 'on' : 'off') + '">📱</span>' +
             '<span class="notify-chip ' + (u.notifyPhone ? 'on' : 'off') + '">📞</span>';
    }

    function updateUserStats(users) {
      document.getElementById('statTotal').textContent = users.length;
      document.getElementById('statAdmin').textContent = users.filter(function(u){ return u.role==='ADMIN'; }).length;
      document.getElementById('statManager').textContent = users.filter(function(u){ return u.role==='MANAGER'; }).length;
      document.getElementById('statUser').textContent = users.filter(function(u){ return u.role==='USER'; }).length;
      document.getElementById('statDisabled').textContent = users.filter(function(u){ return u.disabled; }).length;
    }

    function roleName(r) {
      if (r === 'ADMIN') return '管理员';
      if (r === 'MANAGER') return '经理';
      if (r === 'USER') return '用户';
      return r || '';
    }
    function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    // ── 数据统计 ────────────────────────────────────────────
    function initStats() { loadStats(); loadTrend(); }

    async function loadStats() {
      var dateEl = document.getElementById('statsDate');
      var date = dateEl && dateEl.value ? dateEl.value : new Date().toISOString().slice(0, 10);
      var dateTag = document.getElementById('statsDateTag');
      if (dateTag) dateTag.textContent = date === new Date().toISOString().slice(0,10) ? '今日' : date;
      try {
        var r = await fetch('/gp/api/stats/daily?date=' + date, { headers: { 'Authorization': 'Bearer ' + token } });
        if (r.status === 403 || r.status === 401) return;
        var data = await r.json();
        renderKpi(data.overview || {});
        renderPageRank(data.pageStats || []);
        renderUserRank(data.topUsers || []);
      } catch(e) { console.error('stats load failed', e); }
    }

    function renderKpi(o) {
      var fmtDur = function(s) {
        if (!s || s <= 0) return '—';
        if (s < 60) return s + 's';
        if (s < 3600) return Math.floor(s/60) + 'm';
        return Math.floor(s/3600) + 'h' + Math.floor((s%3600)/60) + 'm';
      };
      document.getElementById('kpiPv').textContent = o.pageViewCount != null ? o.pageViewCount : '—';
      document.getElementById('kpiUv').textContent = o.uniqueVisitors != null ? o.uniqueVisitors : '—';
      document.getElementById('kpiUsers').textContent = o.userCount != null ? o.userCount : '—';
      document.getElementById('kpiDuration').textContent = (o.totalDurationSec || 0) > 0 ? fmtDur(o.totalDurationSec) : '—';
      document.getElementById('kpiLogins').textContent = o.loginCount != null ? o.loginCount : '—';
      document.getElementById('kpiNewUsers').textContent = o.newUserCount != null ? o.newUserCount : '—';
    }

    function renderPageRank(pages) {
      var tbody = document.getElementById('pageRankBody');
      if (!pages || pages.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="color:var(--text-muted);text-align:center;padding:20px">暂无数据</td></tr>';
        return;
      }
      tbody.innerHTML = pages.slice(0, 8).map(function(p, i) {
        return '<tr><td><span class="rank">' + (i+1) + '</span></td><td><span style="font-size:12px;color:var(--text-muted);">' + esc(p.pageName||p.pagePath||'') + '</span></td><td style="font-weight:600">' + p.pv + '</td><td style="color:var(--text-muted)">' + p.uv + '</td></tr>';
      }).join('');
    }

    function renderUserRank(users) {
      var tbody = document.getElementById('userRankBody');
      if (!users || users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="color:var(--text-muted);text-align:center;padding:20px">暂无数据</td></tr>';
        return;
      }
      var maxDur = Math.max.apply(null, users.map(function(u) { return u.totalDurationSec||0; }));
      tbody.innerHTML = users.slice(0, 8).map(function(u, i) {
        var label = esc(u.username || u.phone || ('ID ' + u.userId));
        var pct = maxDur > 0 ? Math.round((u.totalDurationSec||0) / maxDur * 100) : 0;
        return '<tr>' +
          '<td><span class="rank">' + (i+1) + '</span></td>' +
          '<td><div style="font-weight:500;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + label + '">' + label + '</div></td>' +
          '<td style="font-weight:600">' + (u.pageViewCount||0) + '</td>' +
          '<td><div class="duration-bar"><div class="duration-track"><div class="duration-fill" style="width:' + pct + '%"></div></div><span style="font-size:11px;color:var(--text-muted);min-width:40px">' + (u.avgDuration||'—') + '</span></div></td>' +
        '</tr>';
      }).join('');
    }

    async function loadTrend() {
      var rangeEl = document.getElementById('statsRange');
      var days = rangeEl ? parseInt(rangeEl.value) : 30;
      try {
        var r = await fetch('/gp/api/stats/daily-overview?days=' + days, { headers: { 'Authorization': 'Bearer ' + token } });
        if (r.status === 403 || r.status === 401) return;
        var data = await r.json();
        renderTrendChart(data);
      } catch(e) { console.error('trend load failed', e); }
    }

    function renderTrendChart(data) {
      var canvas = document.getElementById('trendChart');
      if (!canvas) return;
      if (window._trendChart) { window._trendChart.destroy(); window._trendChart = null; }
      var ctx = canvas.getContext('2d');
      var labels = data.map(function(d) {
        var dt = new Date(d.date);
        return (dt.getMonth()+1) + '/' + dt.getDate();
      });
      var pvData = data.map(function(d) { return d.pageViewCount || 0; });
      var uvData = data.map(function(d) { return d.uniqueVisitors || 0; });
      window._trendChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [

    // ── 投资池说明面板 ─────────────────────────────────────
    var POOL_META_TYPES = ['tech_ai', 'innovative_drug', 'quality'];
    var POOL_META_LABELS = { tech_ai: '科技AI（10×PS）', innovative_drug: '创新药', quality: '质量优选' };
    var poolMetaCurrentPool = 'tech_ai';
    var poolMetaCache = {};   // poolType -> {meta, slots, stocks[]}

    function setPoolMetaMsg(id, text, isErr) {
      var el = document.getElementById(id);
      if (!el) return;
      el.textContent = text || '';
      el.className = 'msg ' + (isErr ? 'err' : 'ok');
      if (text) setTimeout(function () { el.textContent = ''; el.className = 'msg'; }, 4000);
    }

    function activePoolMetaTab(pool) {
      poolMetaCurrentPool = pool;

        b.classList.toggle('active', b.dataset.pool === pool);
      });

    function initPoolMetaPanel() {
      // 三个 sub-tab 绑定
      document.querySelectorAll('.poolmeta-tab').forEach(function (b) {

        });

      if (saveSlotsBtn) saveSlotsBtn.addEventListener('click', savePoolMetaSlots);

      activePoolMetaTab('tech_ai');   // 默认切到科技AI（10×PS）

    async function fetchPoolMeta(poolType) {
      if (poolMetaCache[poolType]) return poolMetaCache[poolType];
      var metaRes = await fetch('/gp/api/invest/pool-meta/' + encodeURIComponent(poolType), {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function (r) { return r.ok ? r.json() : null; });
      var slotsRes = await fetch('/gp/api/invest/weekly-opportunity/' + encodeURIComponent(poolType), {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function (r) { return r.ok ? r.json() : []; });
      var stocksRes = await fetch('/gp/api/invest/pool?poolType=' + encodeURIComponent(poolType), {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function (r) { return r.ok ? r.json() : []; });
      poolMetaCache[poolType] = { meta: metaRes, slots: slotsRes, stocks: stocksRes };
      return poolMetaCache[poolType];
    }

    async function renderPoolMetaPanel() {
      var pool = poolMetaCurrentPool;
      var panelMsg = document.getElementById('poolMetaPanelMsg');
      if (panelMsg) { panelMsg.textContent = ''; panelMsg.className = 'msg'; }
      var data = await fetchPoolMeta(pool);
      if (!data || !data.meta) {
        if (panelMsg) { panelMsg.textContent = '加载失败：' + pool + ' 数据为空'; panelMsg.className = 'msg err'; }
        return;
      }
      var meta = data.meta;
      var slots = data.slots || [];
      var stocks = data.stocks || [];

      document.getElementById('poolMetaCurrentTitle').textContent =
        (POOL_META_LABELS[pool] || pool) + ' · ' + pool;
      document.getElementById('poolMetaUpdatedAt').textContent =
        meta.updatedAt ? ('更新于 ' + String(meta.updatedAt).replace('T', ' ').slice(0, 16)) : '尚未编辑';

      var coverImg = document.getElementById('poolMetaCoverPreview');
      var coverMeta = document.getElementById('poolMetaCoverMeta');
      if (meta.coverImageUrl) {
        coverImg.src = meta.coverImageUrl;
        coverMeta.textContent = meta.coverImageUrl;
      } else {
        coverImg.removeAttribute('src');
        coverMeta.textContent = '未上传（默认图仅在 invest.html 兜底）';
      }

      var disp = document.getElementById('poolMetaDisplayName');
      if (document.activeElement !== disp) disp.value = meta.displayName || '';
      document.getElementById('poolMetaValuationMd').value = meta.valuationMethodMd || '';

      renderPoolMetaSlots(slots, stocks);
    }

    function renderPoolMetaSlots(slots, stocks) {
      var grid = document.getElementById('poolMetaWeeklySlots');
      var count = document.getElementById('poolMetaWeeklySlotCount');
      if (!grid) return;
      // 构建该池的 datalist：value=stockCode, label=stockName (stockCode)
      var dlId = 'pool-stocks-' + poolMetaCurrentPool;
      var dlHtml = '<datalist id="' + dlId + '">' + stocks.map(function (s) {
        return '<option value="' + esc(s.stockCode) + '">' + esc(s.stockName || s.stockCode) + ' (' + esc(s.stockCode) + ')</option>';
      }).join('') + '</datalist>';
      // 旧的同名 datalist 先清掉，避免堆积
      var oldDl = document.getElementById(dlId);
      if (oldDl) oldDl.remove();
      // 挂到 grid 容器下（不参与布局）
      grid.insertAdjacentHTML('beforebegin', dlHtml);
      // 名称 map：code -> name（用于代码 → 名称自动联动）
      var nameByCode = {};
      stocks.forEach(function (s) { if (s.stockCode) nameByCode[s.stockCode] = s.stockName || ''; });

      var html = '';
      var filled = 0;
      for (var i = 0; i < 9; i++) {
        var slot = slots.find(function (s) { return s.slotIndex === i; }) || { slotIndex: i, stockCode: '', stockName: '', userStockName: '', reason: '', imageUrl: '' };
        if (slot.stockCode) filled++;
        // 名称：用户手工填的优先；没填就用联动的 stockName
        var displayName = slot.userStockName || slot.stockName || '';
        var imgUrl = slot.imageUrl || '';
        var hasImg = !!imgUrl;
        html += '<div class="poolmeta-slot-card" data-slot="' + i + '">' +
          '<div class="poolmeta-slot-head"><span class="poolmeta-slot-no">#' + (i + 1) + '</span></div>' +
          '<div class="poolmeta-slot-row">' +
            '<input class="form-input poolmeta-slot-code" type="text" data-slot-code="' + i + '" list="' + dlId + '" placeholder="代码（可输入任意）" value="' + esc(slot.stockCode || '') + '" autocomplete="off" />' +
            '<input class="form-input poolmeta-slot-name" type="text" data-slot-name="' + i + '" placeholder="名称（可手工填）" value="' + esc(displayName) + '" />' +
          '</div>' +
          '<input class="form-input" type="text" data-slot-reason="' + i + '" maxlength="80" placeholder="推荐理由（1-2 句话）" value="' + esc(slot.reason || '') + '" />' +
          '<input type="hidden" data-slot-image="' + i + '" value="' + esc(imgUrl) + '" />' +
          '<div class="poolmeta-slot-img">' +
            '<div class="poolmeta-slot-img-preview' + (hasImg ? ' has-image' : '') + '" data-slot-image-preview="' + i + '">' +
              (hasImg ? '<img src="' + esc(imgUrl) + '" alt="slot 截图" data-slot-image-img="' + i + '" />' : '') +
            '</div>' +
            '<div class="poolmeta-slot-img-actions">' +
              '<label class="poolmeta-slot-img-btn" style="cursor:pointer">📷 上传截图' +
                '<input type="file" accept="image/*" data-slot-image-file="' + i + '" hidden />' +
              '</label>' +
              '<button type="button" class="poolmeta-slot-img-btn danger" data-slot-image-clear="' + i + '" style="' + (hasImg ? '' : 'display:none') + '">🗑️ 清除</button>' +
              '<span class="poolmeta-slot-img-msg" data-slot-image-msg="' + i + '"></span>' +
            '</div>' +
          '</div>' +
          '</div>';
      }
      grid.innerHTML = html;
      bindPoolMetaSlotEvents(stocks, nameByCode);
      if (count) count.textContent = filled + '/9';
    }

    /**
     * 绑定单格交互：
     * - 代码 input：datalist 选完后，若名称框为空则用 nameByCode 自动填
     * - 上传文件：POST /api/invest/weekly-opportunity/{poolType}/{slotIndex}/image
     * - 清除：DELETE 同 URL
     */
    function bindPoolMetaSlotEvents(stocks, nameByCode) {
      var grid = document.getElementById('poolMetaWeeklySlots');
      if (!grid) return;
      grid.querySelectorAll('input[data-slot-code]').forEach(function (inp) {
        inp.addEventListener('change', function () {
          var i = parseInt(inp.dataset.slotCode, 10);
          var nameInp = grid.querySelector('input[data-slot-name="' + i + '"]');
          if (!nameInp) return;
          // datalist 选完，且名称框为空 → 自动填名称
          var code = (inp.value || '').trim();
          if (code && !nameInp.value.trim() && nameByCode[code]) {
            nameInp.value = nameByCode[code];
          }
        });
      });
      grid.querySelectorAll('input[data-slot-image-file]').forEach(function (file) {
        file.addEventListener('change', function () {
          if (file.files && file.files[0]) uploadSlotImage(file);
        });
      });
      grid.querySelectorAll('button[data-slot-image-clear]').forEach(function (btn) {
        btn.addEventListener('click', function () { clearSlotImage(btn); });
      });
    }

    function setSlotImgMsg(i, text, isErr) {
      var el = document.querySelector('[data-slot-image-msg="' + i + '"]');
      if (!el) return;
      el.textContent = text || '';
      el.className = 'poolmeta-slot-img-msg' + (isErr ? ' err' : (text ? ' ok' : ''));
    }

    function applySlotImage(i, url) {
      var grid = document.getElementById('poolMetaWeeklySlots');
      if (!grid) return;
      var hidden = grid.querySelector('input[data-slot-image="' + i + '"]');
      var preview = grid.querySelector('[data-slot-image-preview="' + i + '"]');
      var img = grid.querySelector('img[data-slot-image-img="' + i + '"]');
      var clearBtn = grid.querySelector('button[data-slot-image-clear="' + i + '"]');
      if (hidden) hidden.value = url || '';
      if (url) {
        if (!img) {
          img = document.createElement('img');
          img.setAttribute('data-slot-image-img', i);
          img.alt = 'slot 截图';
          img.style.maxWidth = '100%';
          img.style.maxHeight = '140px';
          img.style.borderRadius = '4px';
          img.style.cursor = 'zoom-in';
          img.style.display = 'block';
          img.addEventListener('click', function () { openImgModal(url); });
          preview.appendChild(img);
        }
        img.src = url;
        preview.classList.add('has-image');
        if (clearBtn) clearBtn.style.display = '';
      } else {
        if (img) img.remove();
        preview.classList.remove('has-image');
        if (clearBtn) clearBtn.style.display = 'none';
      }
    }

    async function uploadSlotImage(fileInput) {
      var i = parseInt(fileInput.dataset.slotImageFile, 10);
      var pool = poolMetaCurrentPool;
      if (!fileInput.files || !fileInput.files[0]) return;
      setSlotImgMsg(i, '上传中…', false);
      var fd = new FormData();
      fd.append('file', fileInput.files[0]);
      try {
        var r = await fetch('/gp/api/invest/weekly-opportunity/' + encodeURIComponent(pool) + '/' + i + '/image', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: fd
        });
        var res = await r.json().catch(function () { return {}; });
        if (!r.ok) throw new Error(res.message || res.error || ('HTTP ' + r.status));
        applySlotImage(i, res.imageUrl);
        setSlotImgMsg(i, '✓ 已上传', false);
        setTimeout(function () { setSlotImgMsg(i, '', false); }, 2500);
      } catch (e) {
        setSlotImgMsg(i, '上传失败：' + e.message, true);
      } finally {
        fileInput.value = '';
      }
    }

    async function clearSlotImage(btn) {
      var i = parseInt(btn.dataset.slotImageClear, 10);
      var pool = poolMetaCurrentPool;
      if (!confirm('确定要清除该格的截图吗？')) return;
      setSlotImgMsg(i, '清除中…', false);
      try {
        var r = await fetch('/gp/api/invest/weekly-opportunity/' + encodeURIComponent(pool) + '/' + i + '/image', {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        var res = await r.json().catch(function () { return {}; });
        if (!r.ok) throw new Error(res.message || res.error || ('HTTP ' + r.status));
        applySlotImage(i, '');
        setSlotImgMsg(i, '✓ 已清除', false);
        setTimeout(function () { setSlotImgMsg(i, '', false); }, 2500);
      } catch (e) {
        setSlotImgMsg(i, '清除失败：' + e.message, true);
      }
    }

    function openImgModal(url) {
      var modal = document.getElementById('poolmetaImgModal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'poolmetaImgModal';
        modal.className = 'poolmeta-img-modal';
        modal.innerHTML = '<img />';
        modal.addEventListener('click', function () { modal.classList.remove('open'); });
        document.body.appendChild(modal);
      }
      modal.querySelector('img').src = url;
      modal.classList.add('open');
    }

    async function savePoolMetaField(which) {
      var pool = poolMetaCurrentPool;
      var payload = { displayName: document.getElementById('poolMetaDisplayName').value || '' };
      if (which === 'valuation') {
        payload.valuationMethodMd = document.getElementById('poolMetaValuationMd').value;
      } else if (which === 'display') {
        // 仅更新 displayName + 已有 markdown
        var cached = poolMetaCache[pool];
        payload.valuationMethodMd = cached && cached.meta ? (cached.meta.valuationMethodMd || '') : '';
      } else {
        return;
      }
      var btnId = which === 'valuation' ? 'poolMetaSaveValuationBtn' : null;
      var msgId = which === 'valuation' ? 'poolMetaValuationMsg' : 'poolMetaPanelMsg';
      var btn = btnId ? document.getElementById(btnId) : null;
      if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
      try {
        var r = await fetch('/gp/api/invest/pool-meta/' + encodeURIComponent(pool), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify(payload)
        });
        var res = await r.json().catch(function () { return {}; });
        if (!r.ok) throw new Error(res.message || res.error || ('HTTP ' + r.status));
        // 刷新缓存 + UI
        delete poolMetaCache[pool];
        if (msgId === 'poolMetaPanelMsg') {
          var pm = document.getElementById(msgId);
          if (pm) { pm.textContent = '显示名称已更新'; pm.className = 'msg ok'; setTimeout(function () { pm.textContent = ''; pm.className = 'msg'; }, 4000); }
        } else {
          setPoolMetaMsg(msgId, '✓ 已保存', false);
        }
        renderPoolMetaPanel();
      } catch (e) {
        if (msgId === 'poolMetaPanelMsg') {
          var pm = document.getElementById(msgId);
          if (pm) { pm.textContent = '保存失败：' + e.message; pm.className = 'msg err'; }
        } else {
          setPoolMetaMsg(msgId, '保存失败：' + e.message, true);
        }
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '💾 保存估值方法'; }
      }
    }

    async function savePoolMetaSlots() {
      var pool = poolMetaCurrentPool;
      var grid = document.getElementById('poolMetaWeeklySlots');
      var items = [];
      grid.querySelectorAll('input[data-slot-code]').forEach(function (codeInp) {
        var i = parseInt(codeInp.dataset.slotCode, 10);
        var nameEl = grid.querySelector('input[data-slot-name="' + i + '"]');
        var reasonEl = grid.querySelector('input[data-slot-reason="' + i + '"]');
        var imageEl = grid.querySelector('input[data-slot-image="' + i + '"]');
        items.push({
          slotIndex: i,
          stockCode: (codeInp.value || '').trim() || null,
          userStockName: nameEl ? (nameEl.value || '').trim() || null : null,
          reason: reasonEl ? (reasonEl.value || '').trim() || null : null,
          imageUrl: imageEl ? (imageEl.value || '').trim() || null : null
        });
      });
      if (items.length !== 9) {
        setPoolMetaMsg('poolMetaSlotsMsg', '9 格不完整：' + items.length + '/9', true);
        return;
      }
      var btn = document.getElementById('poolMetaSaveSlotsBtn');
      btn.disabled = true; btn.textContent = '保存中…';
      try {
        var r = await fetch('/gp/api/invest/weekly-opportunity/' + encodeURIComponent(pool), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ slots: items })
        });
        var res = await r.json().catch(function () { return {}; });
        if (!r.ok) throw new Error(res.message || res.error || ('HTTP ' + r.status));
        setPoolMetaMsg('poolMetaSlotsMsg', '✓ 9 格已保存', false);
        // 清理缓存后渲染
        delete poolMetaCache[pool];
        renderPoolMetaPanel();
      } catch (e) {
        setPoolMetaMsg('poolMetaSlotsMsg', '保存失败：' + e.message, true);
      } finally {
        btn.disabled = false; btn.textContent = '💾 保存 9 格';
      }
    }

    async function uploadPoolMetaCover() {
      var pool = poolMetaCurrentPool;
      var fileInput = document.getElementById('poolMetaCoverFile');
      if (!fileInput.files || !fileInput.files[0]) return;
      var fd = new FormData();
      fd.append('file', fileInput.files[0]);
      var btn = document.getElementById('poolMetaCoverBtn');
      btn.disabled = true; btn.textContent = '上传中…';
      try {
        var r = await fetch('/gp/api/invest/pool-meta/' + encodeURIComponent(pool) + '/cover-image', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: fd
        });
        var res = await r.json().catch(function () { return {}; });
        if (!r.ok) throw new Error(res.message || res.error || ('HTTP ' + r.status));
        var pm = document.getElementById('poolMetaPanelMsg');
        if (pm) { pm.textContent = '✓ 封面图已更新'; pm.className = 'msg ok'; setTimeout(function () { pm.textContent = ''; pm.className = 'msg'; }, 3000); }
        delete poolMetaCache[pool];
        renderPoolMetaPanel();
      } catch (e) {
        var pm = document.getElementById('poolMetaPanelMsg');
        if (pm) { pm.textContent = '上传失败：' + e.message; pm.className = 'msg err'; }
      } finally {
        btn.disabled = false; btn.textContent = '📷 更换封面图';
        fileInput.value = '';
      }
    }

    var QUOTE_PRESET_TAGS = ['价值投资','成长股','护城河','复利','风险','仓位','逆向','长期','赛道','估值','人性','趋势'];
    var quoteAdminKw = '';
    var quoteAdminPage = 0;
    const QUOTE_PAGE_SIZE = 20;
    let quoteAdminSelectedTags = new Set();

    function setQuoteAdminMsg(id, text, isErr) {
      var el = document.getElementById(id);
      if (!el) return;
      el.textContent = text || '';
      el.className = 'msg' + (isErr ? ' err' : (text ? ' ok' : ''));
    }

    function renderQuoteAdminTagChips() {
      var box = document.getElementById('quoteAdminTagChips');
      if (!box) return;
      box.innerHTML = '';
      QUOTE_PRESET_TAGS.forEach(function(tag) {
        var chip = document.createElement('span');
        chip.className = 'quote-tag-chip' + (quoteAdminSelectedTags.has(tag) ? ' selected' : '');
        chip.textContent = tag;
        chip.addEventListener('click', function() {
          if (quoteAdminSelectedTags.has(tag)) {
            quoteAdminSelectedTags.delete(tag);
            chip.classList.remove('selected');
          } else {
            quoteAdminSelectedTags.add(tag);
            chip.classList.add('selected');
          }
        });
        box.appendChild(chip);
      });
    }

    function addQuoteAdminCustomTag(tag) {
      tag = (tag || '').trim();
      if (!tag) return;
      if (!QUOTE_PRESET_TAGS.includes(tag)) {
        var box = document.getElementById('quoteAdminTagChips');
        var chip = document.createElement('span');
        chip.className = 'quote-tag-chip selected custom';
        chip.textContent = tag;
        chip.addEventListener('click', function() {
          if (quoteAdminSelectedTags.has(tag)) {
            quoteAdminSelectedTags.delete(tag);
            chip.classList.remove('selected');
          } else {
            quoteAdminSelectedTags.add(tag);
            chip.classList.add('selected');
          }
        });
        box.appendChild(chip);
      }
      quoteAdminSelectedTags.add(tag);
      var input = document.getElementById('quoteAdminTagCustomInput');
      if (input) input.value = '';
    }

    async function loadQuoteAdminPage() {
      var tbody = document.getElementById('quoteAdminTableBody');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:20px">加载中…</td></tr>';
      try {
        var params = new URLSearchParams({ kw: quoteAdminKw, page: quoteAdminPage, size: QUOTE_PAGE_SIZE });
        var r = await fetch('/gp/api/quotes?' + params, { headers: { 'Authorization': 'Bearer ' + token } });
        if (r.status === 403 || r.status === 401) {
          tbody.innerHTML = '<tr><td colspan="5" style="color:#e53;text-align:center;padding:20px">权限不足，仅管理员可访问</td></tr>';
          return;
        }
        var data = await r.json();
        var list = data.list || [];
        var total = data.total || 0;
        var totalPages = Math.max(1, Math.ceil(total / QUOTE_PAGE_SIZE));
        document.getElementById('quoteAdminTotalTag').textContent = '共 ' + total + ' 条';
        document.getElementById('quoteAdminPageInfo').textContent = '第 ' + (quoteAdminPage + 1) + ' / ' + totalPages + ' 页';
        document.getElementById('quoteAdminPrevPageBtn').disabled = quoteAdminPage <= 0;
        document.getElementById('quoteAdminNextPageBtn').disabled = quoteAdminPage >= totalPages - 1;
        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:20px">暂无金句，点击上方添加</td></tr>';
          return;
        }
        tbody.innerHTML = '';
        list.forEach(function(q) {
          var tr = document.createElement('tr');
          tr.innerHTML =
            '<td><div class="quote-admin-cell-content">' + esc(q.content) + '</div>' +
              (q.tags ? '<div class="quote-admin-cell-tags">' + q.tags.split(',').map(function(t){return '<span class="quote-tag-mini">'+esc(t.trim())+'</span>';}).join('') + '</div>' : '') +
            '</td>' +
            '<td>' + esc(q.author || '—') + '</td>' +
            '<td>' + esc(q.source || '—') + '</td>' +
            '<td>❤️ ' + (q.likes || 0) + '</td>' +
            '<td><button class="btn-sm danger" data-del="' + q.id + '">删除</button></td>';
          tbody.appendChild(tr);
        });
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#e53;text-align:center;padding:20px">加载失败：' + e.message + '</td></tr>';
      }
    }

    async function initQuoteAdminPanel() {
      renderQuoteAdminTagChips();

      // Tab 切换
      document.querySelectorAll('#quoteAdminTabs .quote-admin-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          document.querySelectorAll('#quoteAdminTabs .quote-admin-tab').forEach(function(t){ t.classList.remove('active'); });
          tab.classList.add('active');
          var name = tab.dataset.tab;
          document.getElementById('quoteAdminSinglePane').style.display = name === 'single' ? '' : 'none';
          document.getElementById('quoteAdminBatchPane').style.display = name === 'batch' ? '' : 'none';
        });
      });

      // 自定义标签
      var customInput = document.getElementById('quoteAdminTagCustomInput');
      if (customInput) {
        customInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') { e.preventDefault(); addQuoteAdminCustomTag(customInput.value); }
        });
      }

      // 单条添加
      document.getElementById('quoteAdminAddBtn').addEventListener('click', async function() {
        var btn = this;
        var content = document.getElementById('quoteAdminContent').value.trim();
        if (!content) { setQuoteAdminMsg('quoteAdminAddMsg', '请输入金句内容', true); return; }
        btn.disabled = true; btn.textContent = '保存中…';
        setQuoteAdminMsg('quoteAdminAddMsg', '');
        try {
          var r = await fetch('/gp/api/quotes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({
              content: content,
              author: document.getElementById('quoteAdminAuthor').value.trim() || null,
              source: document.getElementById('quoteAdminSource').value.trim() || null,
              tags: quoteAdminSelectedTags.size > 0 ? [...quoteAdminSelectedTags].join(',') : null
            })
          });
          if (!r.ok) {
            var data = await r.json().catch(function(){return {};});
            throw new Error(data.message || data.error || ('HTTP ' + r.status));
          }
          document.getElementById('quoteAdminContent').value = '';
          document.getElementById('quoteAdminAuthor').value = '';
          document.getElementById('quoteAdminSource').value = '';
          quoteAdminSelectedTags.clear();
          renderQuoteAdminTagChips();
          setQuoteAdminMsg('quoteAdminAddMsg', '✅ 已添加');
          quoteAdminPage = 0;
          await loadQuoteAdminPage();
        } catch (e) {
          setQuoteAdminMsg('quoteAdminAddMsg', '保存失败：' + e.message, true);
        } finally {
          btn.disabled = false; btn.textContent = '＋ 添加金句';
        }
      });

      // 批量添加
      document.getElementById('quoteAdminBatchBtn').addEventListener('click', async function() {
        var btn = this;
        var raw = document.getElementById('quoteAdminBatch').value;
        var lines = raw.split('\n').map(function(l){return l.trim();}).filter(Boolean);
        if (lines.length === 0) { setQuoteAdminMsg('quoteAdminBatchMsg', '请输入至少一条金句', true); return; }
        btn.disabled = true; btn.textContent = '批量保存中…';
        setQuoteAdminMsg('quoteAdminBatchMsg', '');
        try {
          var r = await fetch('/gp/api/quotes/batch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify(lines)
          });
          if (!r.ok) {
            var data = await r.json().catch(function(){return {};});
            throw new Error(data.message || data.error || ('HTTP ' + r.status));
          }
          var saved = await r.json();
          document.getElementById('quoteAdminBatch').value = '';
          setQuoteAdminMsg('quoteAdminBatchMsg', '✅ 已添加 ' + (saved.length || lines.length) + ' 条');
          quoteAdminPage = 0;
          await loadQuoteAdminPage();
        } catch (e) {
          setQuoteAdminMsg('quoteAdminBatchMsg', '保存失败：' + e.message, true);
        } finally {
          btn.disabled = false; btn.textContent = '💾 批量保存';
        }
      });

      // 搜索
      var searchInput = document.getElementById('quoteAdminSearchInput');
      var searchBtn = document.getElementById('quoteAdminSearchBtn');
      var doSearch = function() {
        quoteAdminKw = searchInput.value.trim();
        quoteAdminPage = 0;
        loadQuoteAdminPage();
      };
      searchBtn.addEventListener('click', doSearch);
      searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') doSearch(); });

      // 分页
      document.getElementById('quoteAdminPrevPageBtn').addEventListener('click', function() {
        if (quoteAdminPage > 0) { quoteAdminPage--; loadQuoteAdminPage(); }
      });
      document.getElementById('quoteAdminNextPageBtn').addEventListener('click', function() {
        quoteAdminPage++;
        loadQuoteAdminPage();
      });

      // 删除
      document.getElementById('quoteAdminTableBody').addEventListener('click', async function(e) {
        var btn = e.target.closest('button[data-del]');
        if (!btn) return;
        var id = btn.dataset.del;
        if (!confirm('确定删除这条金句吗？')) return;
        try {
          var r = await fetch('/gp/api/quotes/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          if (!r.ok) {
            var data = await r.json().catch(function(){return {};});
            throw new Error(data.message || data.error || ('HTTP ' + r.status));
          }
          await loadQuoteAdminPage();
        } catch (err) {
          alert('删除失败：' + err.message);
        }
      });

      await loadQuoteAdminPage();
    }

    // 默认加载
    initStats();
  });
  </script>
</body>
</html>
