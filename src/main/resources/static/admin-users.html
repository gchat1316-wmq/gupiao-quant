<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户管理 · 投资助手</title>
  <base href="/gp/" />
  <link rel="stylesheet" href="css/skin.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: var(--bg); }
    .admin-shell { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .admin-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; color: var(--text); }
    .admin-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .admin-section-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .user-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .user-table th { text-align: left; color: var(--text-muted); padding: 8px 10px; border-bottom: 2px solid var(--border); font-weight: 500; white-space: nowrap; }
    .user-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .user-table tr:last-child td { border-bottom: none; }
    .user-table tr.disabled-row td { opacity: 0.5; }
    .avatar-cell { width: 36px; }
    .avatar-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--border); }
    .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .role-badge.ADMIN { background: #e53; color: #fff; }
    .role-badge.MANAGER { background: var(--primary); color: #fff; }
    .role-badge.USER { background: var(--border); color: var(--text-muted); }
    .role-badge.DISABLED { background: #888; color: #fff; }
    .role-select { padding: 3px 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 12px; }
    .notify-badges { display: flex; gap: 4px; flex-wrap: wrap; }
    .notify-chip { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 500; }
    .notify-chip.on { background: #dcfce7; color: #166534; }
    .notify-chip.off { background: var(--border); color: var(--text-muted); }
    .btn-sm { padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 12px; color: var(--text); }
    .btn-sm:hover { background: var(--hover-bg); }
    .btn-sm.danger { border-color: #e53; color: #e53; }
    .btn-sm.danger:hover { background: #e53; color: #fff; }
    .btn-sm.success { border-color: #22c55e; color: #22c55e; }
    .btn-sm.success:hover { background: #22c55e; color: #fff; }
    .gen-code-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .form-field { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 13px; font-weight: 500; color: var(--text); }
    .form-input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: var(--surface); color: var(--text); }
    .primary-btn { padding: 6px 16px; border-radius: 6px; border: none; background: var(--primary); color: #fff; cursor: pointer; font-size: 14px; }
    .primary-btn:hover { opacity: 0.9; }
    .gen-result { margin-top: 12px; padding: 12px; background: #f0f9ff; border: 1px solid #b3d8fd; border-radius: 8px; font-size: 14px; }
    .gen-result code { font-size: 16px; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
    .msg { font-size: 13px; margin-top: 6px; }
    .msg.ok { color: #22c55e; }
    .msg.err { color: #e53; }
    .admin-unauthorized { max-width: 400px; margin: 80px auto; text-align: center; padding: 40px; }
    .admin-unauthorized h2 { font-size: 20px; color: var(--text); }
    .admin-unauthorized p { color: var(--text-muted); margin-top: 12px; }
    .expand-btn { font-size: 11px; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border); cursor: pointer; background: transparent; color: var(--text-muted); }
    .expand-btn:hover { background: var(--hover-bg); }
    .notify-edit-row { display: none; background: #f8fafc; }
    .notify-edit-row td { padding: 12px 16px; }
    .notify-toggle-group { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .notify-toggle-item { display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .notify-toggle-item input { cursor: pointer; }
    .inline-actions { display: flex; gap: 4px; align-items: center; }
    .stat-bar { display: flex; gap: 16px; margin-bottom: 16px; }
    .stat-item { font-size: 13px; color: var(--text-muted); }
    .stat-item span { font-weight: 600; color: var(--text); }
  </style>
</head>
<body>
  <div id="siteHeader"></div>
  <div id="adminContent"></div>

  <script src="js/layout.js" defer></script>
  <script>
  document.addEventListener('DOMContentLoaded', async function () {
    await new Promise(r => setTimeout(r, 100));

    var content = document.getElementById('adminContent');
    var token = localStorage.getItem('gp_auth_token');
    if (!token) {
      content.innerHTML = '<div class="admin-unauthorized"><h2>请先登录</h2><p>管理员功能需要先登录</p></div>';
      return;
    }

    var me = await fetch('/gp/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });

    if (!me || me.role !== 'ADMIN') {
      content.innerHTML = '<div class="admin-unauthorized"><h2>权限不足</h2><p>仅管理员可访问此页面</p></div>';
      return;
    }

    content.innerHTML = `
      <div class="admin-shell">
        <div class="admin-title">👤 用户管理</div>

        <div class="admin-section">
          <div class="admin-section-title">📋 用户概览</div>
          <div class="stat-bar" id="statBar">
            <div class="stat-item">总用户: <span id="statTotal">—</span></div>
            <div class="stat-item">管理员: <span id="statAdmin">—</span></div>
            <div class="stat-item">经理: <span id="statManager">—</span></div>
            <div class="stat-item">普通用户: <span id="statUser">—</span></div>
            <div class="stat-item">已禁用: <span id="statDisabled">—</span></div>
          </div>
        </div>

        <div class="admin-section">
          <div class="admin-section-title">🔑 生成登录码</div>
          <div class="gen-code-form">
            <div class="form-field">
              <label class="form-label">分配角色</label>
              <select id="genRole" class="form-input">
                <option value="MANAGER">MANAGER（经理）</option>
                <option value="ADMIN">ADMIN（系统管理员）</option>
              </select>
            </div>
            <div class="form-field">
              <label class="form-label">有效期（天）</label>
              <input id="genDays" class="form-input" type="number" value="7" min="1" max="30" style="width:80px" />
            </div>
            <div class="form-field">
              <label class="form-label">&nbsp;</label>
              <button id="genBtn" class="primary-btn">生成登录码</button>
            </div>
          </div>
          <div id="genResult" class="gen-result hidden"></div>
          <div id="genMsg" class="msg"></div>
        </div>

        <div class="admin-section">
          <div class="admin-section-title">👥 用户列表</div>
          <table class="user-table">
            <thead>
              <tr>
                <th class="avatar-cell">头像</th>
                <th>ID</th>
                <th>用户名 / 手机</th>
                <th>角色</th>
                <th>通知偏好</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <tr><td colspan="7" style="text-align:center;color:var(--text-muted)">加载中…</td></tr>
            </tbody>
          </table>
          <div id="listMsg" class="msg"></div>
        </div>
      </div>`;

    // 生成登录码
    document.getElementById('genBtn').addEventListener('click', async function () {
      var role = document.getElementById('genRole').value;
      var days = parseInt(document.getElementById('genDays').value) || 7;
      var btn = this; btn.disabled = true; btn.textContent = '生成中…';
      var resultDiv = document.getElementById('genResult');
      var msgDiv = document.getElementById('genMsg');
      resultDiv.classList.add('hidden'); msgDiv.textContent = ''; msgDiv.className = 'msg';
      try {
        var r = await fetch('/gp/api/auth/admin/login-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ role: role, expireDays: days })
        });
        var data = await r.json();
        if (data.error) { msgDiv.textContent = '错误: ' + data.error; msgDiv.classList.add('err'); }
        else {
          resultDiv.innerHTML = '登录码生成成功！将此码发给对应人员：<br><code>' + data.code + '</code>';
          resultDiv.classList.remove('hidden');
          loadUsers();
        }
      } catch (e) { msgDiv.textContent = '网络错误'; msgDiv.classList.add('err'); }
      finally { btn.disabled = false; btn.textContent = '生成登录码'; }
    });

    async function loadUsers() {
      var tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted)">加载中…</td></tr>';
      try {
        var r = await fetch('/gp/api/auth/admin/users', { headers: { 'Authorization': 'Bearer ' + token } });
        if (r.status === 403 || r.status === 401) { tbody.innerHTML = '<tr><td colspan="7" style="color:#e53">权限不足</td></tr>'; return; }
        var users = await r.json();
        updateStats(users);
        tbody.innerHTML = '';
        users.forEach(function (u) {
          var isDisabled = u.disabled === true;
          var rowClass = isDisabled ? 'disabled-row' : '';
          var avatar = u.avatarUrl
            ? '<img class="avatar-img" src="' + esc(u.avatarUrl) + '" alt="头像" onerror="this.style.display=\'none\'">'
            : '<div class="avatar-img" style="display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-muted)">👤</div>';
          var roleBadge = '<span class="role-badge ' + u.role + '">' + roleName(u.role) + '</span>';
          var statusBadge = isDisabled
            ? '<span class="role-badge DISABLED">已禁用</span>'
            : '<span class="notify-chip on">正常</span>';
          var notifyChips = makeNotifyChips(u);
          tbody.innerHTML +=
            '<tr class="' + rowClass + '" id="user-row-' + u.id + '">' +
              '<td class="avatar-cell">' + avatar + '</td>' +
              '<td>' + u.id + '</td>' +
              '<td><div style="font-weight:500">' + esc(u.username || '—') + '</div><div style="font-size:12px;color:var(--text-muted)">' + esc(u.phone || '—') + '</div></td>' +
              '<td><select class="role-select" id="role-' + u.id + '">' +
                '<option value="ADMIN"' + (u.role==='ADMIN'?' selected':'') + '>ADMIN</option>' +
                '<option value="MANAGER"' + (u.role==='MANAGER'?' selected':'') + '>MANAGER</option>' +
                '<option value="USER"' + (u.role==='USER'?' selected':'') + '>USER</option>' +
              '</select></td>' +
              '<td><div class="notify-badges" id="notify-' + u.id + '">' + notifyChips + '</div></td>' +
              '<td>' + statusBadge + '</td>' +
              '<td class="inline-actions">' +
                '<button class="btn-sm save-role-btn" data-id="' + u.id + '">💾 保存角色</button>' +
                (isDisabled
                  ? '<button class="btn-sm success enable-btn" data-id="' + u.id + '">启用</button>'
                  : '<button class="btn-sm danger disable-btn" data-id="' + u.id + '">禁用</button>'
                ) +
                '<button class="expand-btn" data-id="' + u.id + '" onclick="toggleNotifyEdit(' + u.id + ')">通知设置</button>' +
              '</td>' +
            '</tr>' +
            '<tr class="notify-edit-row" id="notify-edit-' + u.id + '">' +
              '<td colspan="7">' +
                '<div style="font-size:13px;font-weight:600;margin-bottom:8px;">编辑通知偏好: ' + esc(u.username || u.phone || u.id) + '</div>' +
                '<div class="notify-toggle-group">' +
                  '<label class="notify-toggle-item"><input type="checkbox" id="nw-' + u.id + '" ' + (u.notifyWechat?'checked':'') + '> 💬 微信通知</label>' +
                  '<label class="notify-toggle-item"><input type="checkbox" id="ns-' + u.id + '" ' + (u.notifySms?'checked':'') + '> 📱 短信通知</label>' +
                  '<label class="notify-toggle-item"><input type="checkbox" id="np-' + u.id + '" ' + (u.notifyPhone?'checked':'') + '> 📞 电话通知</label>' +
                  '<button class="btn-sm" onclick="saveNotify(' + u.id + ')">保存通知</button>' +
                  '<button class="btn-sm" onclick="toggleNotifyEdit(' + u.id + ')">收起</button>' +
                '</div>' +
              '</td>' +
            '</tr>';
        });
        // 绑定保存角色按钮
        tbody.querySelectorAll('.save-role-btn').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            var id = this.dataset.id;
            var sel = document.getElementById('role-' + id);
            var newRole = sel.value;
            var msgEl = document.getElementById('listMsg');
            var r = await fetch('/gp/api/auth/admin/users/' + id + '/role', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
              body: JSON.stringify({ role: newRole })
            });
            var res = await r.json();
            if (res.error) { msgEl.textContent = res.error; msgEl.className = 'msg err'; }
            else { msgEl.textContent = '已更新为 ' + roleName(newRole); msgEl.className = 'msg ok'; loadUsers(); }
          });
        });
        // 绑定禁用/启用按钮
        tbody.querySelectorAll('.disable-btn').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            var id = this.dataset.id;
            var msgEl = document.getElementById('listMsg');
            var r = await fetch('/gp/api/auth/admin/users/' + id + '/disabled', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
              body: JSON.stringify({ disabled: true })
            });
            var res = await r.json();
            if (res.error) { msgEl.textContent = res.error; msgEl.className = 'msg err'; }
            else { msgEl.textContent = '用户已禁用'; msgEl.className = 'msg ok'; loadUsers(); }
          });
        });
        tbody.querySelectorAll('.enable-btn').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            var id = this.dataset.id;
            var msgEl = document.getElementById('listMsg');
            var r = await fetch('/gp/api/auth/admin/users/' + id + '/disabled', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
              body: JSON.stringify({ disabled: false })
            });
            var res = await r.json();
            if (res.error) { msgEl.textContent = res.error; msgEl.className = 'msg err'; }
            else { msgEl.textContent = '用户已启用'; msgEl.className = 'msg ok'; loadUsers(); }
          });
        });
      } catch (e) { tbody.innerHTML = '<tr><td colspan="7" style="color:#e53">加载失败: ' + e.message + '</td></tr>'; }
    }

    window.toggleNotifyEdit = function(id) {
      var row = document.getElementById('notify-edit-' + id);
      row.style.display = row.style.display === 'table-row' ? 'none' : 'table-row';
    };

    window.saveNotify = async function(id) {
      var nw = document.getElementById('nw-' + id).checked;
      var ns = document.getElementById('ns-' + id).checked;
      var np = document.getElementById('np-' + id).checked;
      var msgEl = document.getElementById('listMsg');
      try {
        var r = await fetch('/gp/api/auth/admin/users/' + id + '/notify', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ notifyWechat: nw, notifySms: ns, notifyPhone: np })
        });
        var res = await r.json();
        if (res.error) { msgEl.textContent = res.error; msgEl.className = 'msg err'; }
        else {
          msgEl.textContent = '通知偏好已更新'; msgEl.className = 'msg ok';
          document.getElementById('notify-' + id).innerHTML = makeNotifyChips(res);
          toggleNotifyEdit(id);
        }
      } catch (e) { msgEl.textContent = '保存失败'; msgEl.className = 'msg err'; }
    };

    function makeNotifyChips(u) {
      var chips = [];
      chips.push('<span class="notify-chip ' + (u.notifyWechat ? 'on' : 'off') + '">💬 微信</span>');
      chips.push('<span class="notify-chip ' + (u.notifySms ? 'on' : 'off') + '">📱 短信</span>');
      chips.push('<span class="notify-chip ' + (u.notifyPhone ? 'on' : 'off') + '">📞 电话</span>');
      return chips.join('');
    }

    function updateStats(users) {
      var total = users.length;
      var admin = users.filter(function(u){ return u.role==='ADMIN'; }).length;
      var manager = users.filter(function(u){ return u.role==='MANAGER'; }).length;
      var user = users.filter(function(u){ return u.role==='USER'; }).length;
      var disabled = users.filter(function(u){ return u.disabled; }).length;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statAdmin').textContent = admin;
      document.getElementById('statManager').textContent = manager;
      document.getElementById('statUser').textContent = user;
      document.getElementById('statDisabled').textContent = disabled;
    }

    function roleName(r) {
      if (r === 'ADMIN') return '管理员';
      if (r === 'MANAGER') return '经理';
      if (r === 'USER') return '用户';
      return r || '';
    }
    function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    loadUsers();
  });
  </script>
</body>
</html>
