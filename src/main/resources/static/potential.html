<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12403a" />
  <base href="/gp/" />
  <title>潜力监控· 投资助手</title>
  <link rel="stylesheet" href="css/skin.css?v=20260618-skin-system" />
  <link rel="stylesheet" href="css/style.css?v=20260618-skin-system" />
  <link rel="stylesheet" href="css/study.css?v=20260618-skin-system" />
  <link rel="stylesheet" href="css/invest.css?v=20260618-skin-system" />
  <link rel="stylesheet" href="css/tech-ai.css?v=20260618-skin-system" />
  <script src="js/layout.js?v=20260629-profile-link" defer></script>
</head>
<body>
  <div id="siteHeader"></div>

  <div class="monitor-banner" style="max-width:960px;margin:12px auto;padding:10px 16px;">
    📢 此页面已迁移 — 统一监控支持 <strong>固定价 + 涨跌幅 + ATR 振幅 + 止盈止损</strong> 多类提醒在同一只股票上叠加
    · <a href="monitor.html" style="color:#ffd866;">→ 打开监控面板</a>
  </div>

  <main class="container tech-ai-page">
    <section class="tech-ai-hero">
      <div>
        <div class="tech-ai-kicker">浮盈加仓 · 移动止损 · 目标止盈</div>
        <h2 class="tech-ai-title">潜力监控</h2>
        <p class="tech-ai-sub">独立潜力池 · 轻仓试错 · 浮盈加仓 · 跟随最高价移动止损 · 目标分批止盈</p>
      </div>
      <div class="tech-ai-hero-actions">
        <button id="refreshBtn" class="invest-btn-outline">刷新</button>
        <button id="runMonitorBtn" class="invest-btn">手动扫描</button>
      </div>
    </section>

    <section class="tech-ai-command">
      <div class="tech-ai-add">
        <input id="stockInput" type="text" placeholder="输入股票代码或名称，如 300733.sz" autocomplete="off" />
        <button id="addStockBtn" class="invest-btn">加入潜力池</button>
      </div>
      <div class="tech-ai-note">内部代码统一为小写后缀格式；QMT 桥会自动转换为 300733.SZ。点"展开"查看建仓/加仓/止损计划。</div>
    </section>

    <section class="tech-ai-panel tech-ai-panel-main">
      <div class="tech-ai-panel-head">
        <div>
          <h3>潜力股票池</h3>
          <p>独立潜力池 · 轻仓试错 · 浮盈加仓 · 移动止损 · 目标止盈</p>
        </div>
        <span id="poolCount" class="tech-ai-pill">0 只</span>
      </div>
      <div id="poolTableWrap" class="tech-ai-table-wrap"></div>
    </section>
  </main>
  <div id="siteFooter"></div>

  <script src="js/potential.js"></script>
</body>
</html>
