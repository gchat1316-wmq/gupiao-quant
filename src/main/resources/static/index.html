<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e88ff" />
  <base href="/gp/" />
  <title>财务分析 · 投资助手</title>
  <link rel="stylesheet" href="css/style.css?v=20260609-red-tech-footer" />
  <link rel="stylesheet" href="css/study.css?v=20260609-red-tech-footer" />
  <script src="js/layout.js?v=20260611-shared-header" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="siteHeader"></div>

  <main class="container">
    <section class="chart-card" style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
        <div>
          <div style="font-size:12px;color:#e1062c;font-weight:700;letter-spacing:.14em;text-transform:uppercase">New Module</div>
          <h2 style="margin:6px 0 8px;font-size:26px">林奇投资</h2>
          <p style="margin:0;color:#6b7280;font-size:14px;max-width:760px">完整承接 astock-peg 的四块能力：自选股 PEG 监控、单股估值快照、行业 PE 对比、新闻聚合与 AI PEG 报告。</p>
        </div>
        <a href="lynch-invest.html" class="primary-btn" style="display:inline-flex;align-items:center;text-decoration:none">进入林奇投资</a>
      </div>
    </section>

    <section class="search-bar">
      <div class="search-input-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9aa4b2" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <circle cx="9" cy="11" r="2" />
            <path d="M21 17l-5-5-4 4-3-3-6 6" />
          </svg>
        </span>
        <input id="searchInput" type="text" inputmode="search" autocomplete="off"
               placeholder="贵州茅台,佰维存储" />
        <button id="clearBtn" class="clear-btn" aria-label="清除">×</button>
      </div>
      <button id="queryBtn" class="primary-btn">查询</button>
    </section>

    <section class="metric-bar">
      <span class="metric-bar-label">指标</span>
      <div class="metric-chips" id="metricChipsMain"></div>
      <span class="metric-count" id="metricCount">已选 0 项</span>
      <div class="metric-actions">
        <button id="metricDefaultBtn" class="metric-link-btn">默认</button>
        <span class="metric-dot">·</span>
        <button id="metricAllBtn" class="metric-link-btn">全选</button>
        <span class="metric-dot">·</span>
        <button id="metricClearBtn" class="metric-link-btn">清空</button>
      </div>
    </section>

    <section id="resultSection" class="result-section hidden">
      <h2 class="section-title">核心财务指标对比分析</h2>
      <p class="section-subtitle" id="subtitle"></p>

      <div id="tablesWrap" class="tables-wrap"></div>

      <!-- 图表 -->
      <div class="chart-card">
        <div class="chart-tabs-row">
          <span class="chart-tabs-label">图表指标：</span>
          <div class="indicator-tabs" id="chartTabs"></div>
        </div>
        <div class="chart-title" id="chartTitle"></div>
        <div class="chart-canvas-wrap">
          <canvas id="metricChart"></canvas>
        </div>
      </div>

      <div class="footer">
        <button id="downloadBtn" class="primary-btn wide">下载图表 + CSV</button>
      </div>
    </section>

    <section id="emptyHint" class="empty-hint">
      <p>输入股票名称或代码,多个用逗号分隔,例如:<code>贵州茅台,600519</code></p>
    </section>
  </main>
  <div id="siteFooter"></div>

  <script src="js/app.js"></script>
</body>
</html>
