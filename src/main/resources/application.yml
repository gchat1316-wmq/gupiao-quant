server:
  port: 8080
  servlet:
    context-path: /gp
    encoding:
      charset: UTF-8
      force: true
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: gupiao-quant
  datasource:
    url: jdbc:mysql://43.140.208.165:3306/wucai_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      # 连接存活检测：MySQL 默认 wait_timeout=8h，设为 28min 提前回收避免服务端断连
      # （设太短会出现 "Connection reset" 误杀；设 28min 既能避开服务端的随机 RST，
      #  又能保证切到 a-stock-data 后真正减少对 MySQL 的依赖）
      max-lifetime: 1700000
      # 空闲连接保活，5min 归还到池
      idle-timeout: 300000
      # keepalive-time：连接池内空闲连接每 60s 发一次心跳，防止被中间链路/LB 静默断连
      keepalive-time: 60000
      # 借出前用 SELECT 1 验证连接是否存活（解决 Connection reset 后拿到死连接的问题）
      connection-test-query: SELECT 1
      # 等待连接超时 20s
      connection-timeout: 20000
      # validation-timeout: SELECT 1 验证最多等 3s（默认5s），避免拖慢请求
      validation-timeout: 3000
      # 池启动时即使连接失败也继续启动（服务能起，DB 恢复后自愈）
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false
  mvc:
    static-path-pattern: /**
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

app:
  upload-dir: uploads
  # PDF 渲染脚本（绝对路径 或 相对项目根目录的路径）；Linux/macOS 各自覆盖
  render-pdf-script: ${RENDER_PDF_SCRIPT:scripts/render_pdf.py}
  # JWT 认证
  jwt:
    # IMPORTANT: empty default; runtime fails-fast if profile != local (see StartupConfigValidator)
    secret: ${JWT_SECRET:}
    expire-hours: 24
  sms:
    code-expire-minutes: 5
    cooldown-seconds: 60
    huaxin:
      url: https://http.yunsms.cn/sms/send.do
      username: ${HUAXIN_SMS_USER:}
      password: ${HUAXIN_SMS_PASSWORD:}
      product-id: ${HUAXIN_SMS_PRODUCT_ID:}
  # 微信登录：有两种方案共存，前端按配置优先级自动选择
  wechat:
    # ── 方案 A：开放平台 - 网站应用 OAuth（点登录按钮 → 微信页面 → 扫码 → 跳回） ──
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    redirect-uri: ${WECHAT_REDIRECT_URI:http://localhost:8080/gp/api/auth/wechat/callback}
    # ── 方案 B：微信公众号"带参数二维码"扫码登录（业内标准体验，登录页直接显示二维码） ──
    # 前置条件：已认证的"服务号"（订阅号不能生成临时二维码），公众号后台"服务器地址(URL)"
    # 配置为本服务的 ${app.wechat.mp.callback-url}（必须公网 80 端口，且开发者中心"网页授权"开启）。
    # 同时配置"消息加解密方式"为"明文模式"，把"消息校验 Token"填到 mp.callback-token。
    mp:
      app-id: ${WECHAT_MP_APP_ID:}
      app-secret: ${WECHAT_MP_APP_SECRET:}
      callback-url: ${WECHAT_MP_CALLBACK_URL:https://aidaily.dpdns.org/gp/api/auth/wechat/mp/callback}
      callback-token: ${WECHAT_MP_CALLBACK_TOKEN:}

baostock-sync:
  enabled: false   # 已禁用（2026-07-07：同步耗时过长且频繁超时，内存压力过大）
  startup-enabled: false
  startup-days-back: 45
  daily-days-back: 30
  daily-cron: "0 20 18 * * MON-FRI"
  python-command: python3
  timeout-seconds: 1800
  # BaoStock 财务 → trade_stock_financial（INSERT IGNORE，仅补缺失季度）
  financial-enabled: true
  financial-cron: "0 30 19 * * MON-FRI"
  financial-start-year: 2024

# 个股分析模块 (紫苏叶/高景气九维)
# 鉴权已统一走 Spring Security：GET 公开，写操作（submit / DELETE）需 MANAGER/ADMIN 角色
stock-analysis:
  enabled: true
  # 优先用环境变量覆盖，默认走项目内 scripts/baostock_client.py (相对路径以项目根为 CWD)
  python-script: ${BAOSTOCK_CLIENT_SCRIPT:scripts/baostock_client.py}
  python-command: ${BAOSTOCK_CLIENT_PYTHON:python3}
  timeout-seconds: 90

prosperity-strong:
  enabled: true
  cron: "0 30 15 * * MON-FRI"
  provider: local
  max-sectors: 5
  leaders-per-sector: 5
  max-candidates: 15
  ai:
    enabled: true
    fallback-to-mock: true
  source:
    sector: eastmoney
    timeout-seconds: 15
  wind:
    skill-dir: ${WIND_SKILL_DIR:${user.home}/.agents/skills/wind-mcp-skill}
    config-path: ${WIND_CONFIG_PATH:${user.home}/.wind-aifinmarket/config}
    timeout-seconds: 15
  tdx:
    enabled: true
    connector-dir: ${TDX_CONNECTOR_DIR:${user.home}/.workbuddy/connectors-marketplace/connectors/tdx-connector}
    # TDX API Key 直调模式（不走 OAuth, 通过 tdx-api-key header 鉴权）
    mcp-url: https://mcp.tdx.com.cn:3001/mcp
    api-key: ${TDX_API_KEY:}

invest-big-yang:
  enabled: true
  startup-enabled: true
  min-streak-days: 1
  max-streak-days: 2
  candidate-lookback-days: 20
  pullback-tolerance-pct: 2.00
  invalid-break-pct: 5.00
  expire-trading-days: 20
  max-signals: 200
  candidate-cron: "0 35 18 * * MON-FRI"
  trigger-cron: "0 */5 9-15 * * MON-FRI"

# 龙江投资股票池后台补全：周末全量 + 每日增量巡检
# refresh-cron  : 全量刷新（拉 BaoStock 日线 + 回填所有池条目）
# backfill-cron : 每日巡检，仅补 NULL 字段，不覆盖手工/OCR/seed 数据
invest-pool:
  refresh-cron: "0 30 20 ? * SAT"
  backfill-cron: "0 30 16 * * ?"

notification:
  serverchan:
    enabled: true
    send-key: ${SERVER_CHAN_SEND_KEY:}
    base-url: https://sctapi.ftqq.com
    timeout-seconds: 10
  quote-monitor:
    enabled: false
    pool-type: tech_ai
    require-trading-time: true
    cooldown-minutes: 10
    daily-dedupe: true
    cron: "0 */1 9-15 * * MON-FRI"
  monitor:
    enabled: true
    require-trading-time: true
    cooldown-minutes: 10
    cron: "0 */1 9-15 * * MON-FRI"
    confirm-cron: "0 5 15 * * MON-FRI"
    default-template: standard
    pool-types:
      - stock
      - tech_ai
      - potential
  wish-pool:
    enabled: true
    webhook-url: ${WISH_POOL_FEISHU_WEBHOOK_URL:}
    timeout-seconds: 10

journal:
  refresh-cron: "0 30 15 * * MON-FRI"
  refresh-enabled: true

daily-recap:
  enabled: true
  # A股: 每个交易日下午 16:00
  a-cron: "0 0 16 * * MON-FRI"
  # 美股: 每个交易日上午 07:30（北京）
  us-cron: "0 30 7 * * MON-FRI"

ai:
  fallback-to-mock: true            # AI 调用失败时是否回退到 mock 数据
  minimax:
    enabled: true                  # 填入 api-key 后改为 true
    base-url: https://api.minimaxi.com/anthropic/v1
    api-key: ${AI_MINIMAX_KEY:}       # 环境变量 AI_MINIMAX_KEY
    group-id: ""                    # 可选: 部分账号需要 group id
    model: MiniMax-M2.7-highspeed       # 可改为 abab6.5s-chat 等其它型号
    timeout-seconds: 90
    max-input-chars: 8000           # 送入模型的资料文本最大字符数
  sensenova:
    enabled: true                  # 填入 api-key 后改为 true
    base-url: https://token.sensenova.cn/v1
    api-key: ${SENSENOVA_API_KEY:${AI_SENSENOVA_KEY:}}     # 环境变量 SENSENOVA_API_KEY / AI_SENSENOVA_KEY
    image-model: sensenova-u1-fast
    chat-model: deepseek-v4-flash   # 用于 AI 详解文本生成
    image-size: "2752x1536"
    timeout-seconds: 120
  tavily:
    enabled: true
    base-url: https://api.tavily.com
    api-key: ${TAVILY_API_KEY:}
    timeout-seconds: 30
    max-results: 5

xiebo-recent-alert:
  enabled: true
  cron: "0 */5 9-15 * * MON-FRI"

logging:
  level:
    root: INFO
    com.quant: INFO
