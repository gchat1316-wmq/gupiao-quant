<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e88ff" />
  <base href="/gp/" />
  <title>财务分析 · 投资助手</title>
  <link rel="stylesheet" href="css/skin.css?v=20260618-skin-system" />
  <link rel="stylesheet" href="css/style.css?v=20260618-skin-system" />
  <link rel="stylesheet" href="css/study.css?v=20260701-feed-merge" />
  <script src="js/layout.js?v=20260701-feed-merge" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="siteHeader"></div>

  <main class="container">
    <!-- 通知 + 金句 混合轮播 -->
    <section class="feed-carousel" id="feedCarousel" aria-label="通知与金句">
      <button type="button" class="feed-arrow" id="feedPrev" aria-label="上一条">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="feed-viewport">
        <div class="feed-track" id="feedTrack">
          <div class="feed-slide">
            <span class="feed-tag type-quote">金句</span>
            <div class="feed-body">
              <div class="feed-content">内容加载中…</div>
            </div>
          </div>
        </div>
        <div class="feed-dots" id="feedDots" role="tablist" aria-label="分页"></div>
      </div>
      <button type="button" class="feed-arrow" id="feedNext" aria-label="下一条">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </section>

    <div class="search-stage is-centered" id="searchStage">
    <section class="search-bar">
      <div class="search-input-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9aa4b2" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <circle cx="9" cy="11" r="2" />
            <path d="M21 17l-5-5-4 4-3-3-6 6" />
          </svg>
        </span>
        <input id="searchInput" type="text" inputmode="search" autocomplete="off"
               placeholder="贵州茅台,佰维存储" />
        <button id="clearBtn" class="clear-btn" aria-label="清除">×</button>
      </div>
      <button id="queryBtn" class="primary-btn">查询</button>
    </section>

    <section class="metric-bar">
      <div class="metric-chips" id="metricChipsMain"></div>
      <span class="metric-count" id="metricCount">已选 0 项</span>
      <div class="metric-actions">
        <button id="metricDefaultBtn" class="metric-link-btn">默认</button>
        <span class="metric-dot">·</span>
        <button id="metricAllBtn" class="metric-link-btn">全选</button>
        <span class="metric-dot">·</span>
        <button id="metricClearBtn" class="metric-link-btn">清空</button>
      </div>
    </section>
    </div>

    <section id="resultSection" class="result-section hidden">
      <h2 class="section-title">核心财务指标对比分析</h2>
      <p class="section-subtitle" id="subtitle"></p>

      <div id="tablesWrap" class="tables-wrap"></div>

      <!-- 图表 -->
      <div class="chart-card">
        <div class="chart-tabs-row">
          <span class="chart-tabs-label">图表指标：</span>
          <div class="indicator-tabs" id="chartTabs"></div>
        </div>
        <div class="chart-title" id="chartTitle"></div>
        <div class="chart-canvas-wrap">
          <canvas id="metricChart"></canvas>
        </div>
      </div>

      <div class="footer">
        <button id="downloadBtn" class="primary-btn wide">免费下载图表 + CSV</button>
      </div>
    </section>

    <section id="emptyHint" class="empty-hint">
      <p>输入股票名称或代码,多个用逗号分隔,例如:<code>贵州茅台,600519</code></p>
    </section>
  </main>
  <div id="siteFooter"></div>

  <script src="js/feed-carousel.js?v=20260701-feed-merge"></script>
  <script src="js/search-stage-center.js?v=20260701-feed-merge"></script>
  <script src="js/app.js"></script>
</body>
</html>
