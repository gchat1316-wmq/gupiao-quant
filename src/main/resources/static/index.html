<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e88ff" />
  <base href="/gp/" />
  <title>财务分析 · 投资助手</title>
  <link rel="stylesheet" href="css/style.css?v=20260609-red-tech-footer" />
  <link rel="stylesheet" href="css/study.css?v=20260609-red-tech-footer" />
  <script src="js/layout.js?v=20260617-recap-nav" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="siteHeader"></div>

  <main class="container">
    <div class="search-stage is-centered" id="searchStage">
    <!-- 通知轮播条 (demo) -->
    <section class="notif-bar" id="notifBar" aria-label="系统通知">
      <div class="notif-bar-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </div>
      <span class="notif-bar-label">通知</span>
      <div class="notif-bar-viewport">
        <ul class="notif-bar-list" id="notifList">
          <!-- demo 数据，后续会从 API 拉取 -->
          <li class="notif-item" data-kind="recap">
            <span class="notif-tag tag-recap">每日复盘</span>
            <span class="notif-text">6月17日 三大指数分化 沪指收平 半导体板块走强</span>
            <span class="notif-time">刚刚</span>
          </li>
          <li class="notif-item" data-kind="analysis">
            <span class="notif-tag tag-analysis">个股分析</span>
            <span class="notif-text">富信科技 已生成 · 观望 · 估值泡沫偏高建议回避</span>
            <span class="notif-time">17:51</span>
          </li>
          <li class="notif-item" data-kind="bigyang">
            <span class="notif-tag tag-biyang">大阳线</span>
            <span class="notif-text">今日暂无触发 · 上次更新 18:30</span>
            <span class="notif-time">18:30</span>
          </li>
          <li class="notif-item" data-kind="ai">
            <span class="notif-tag tag-ai">AI 监控</span>
            <span class="notif-text">实时运行中 · 暂无新告警</span>
            <span class="notif-time">18:38</span>
          </li>
        </ul>
      </div>
      <div class="notif-bar-dots" id="notifDots" role="tablist" aria-label="通知分页"></div>
    </section>

    <section class="search-bar">
      <div class="search-input-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9aa4b2" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <circle cx="9" cy="11" r="2" />
            <path d="M21 17l-5-5-4 4-3-3-6 6" />
          </svg>
        </span>
        <input id="searchInput" type="text" inputmode="search" autocomplete="off"
               placeholder="贵州茅台,佰维存储" />
        <button id="clearBtn" class="clear-btn" aria-label="清除">×</button>
      </div>
      <button id="queryBtn" class="primary-btn">查询</button>
    </section>

    <section class="metric-bar">
      <span class="metric-bar-label">指标</span>
      <div class="metric-chips" id="metricChipsMain"></div>
      <span class="metric-count" id="metricCount">已选 0 项</span>
      <div class="metric-actions">
        <button id="metricDefaultBtn" class="metric-link-btn">默认</button>
        <span class="metric-dot">·</span>
        <button id="metricAllBtn" class="metric-link-btn">全选</button>
        <span class="metric-dot">·</span>
        <button id="metricClearBtn" class="metric-link-btn">清空</button>
      </div>
    </section>
    </div>

    <section id="resultSection" class="result-section hidden">
      <h2 class="section-title">核心财务指标对比分析</h2>
      <p class="section-subtitle" id="subtitle"></p>

      <div id="tablesWrap" class="tables-wrap"></div>

      <!-- 图表 -->
      <div class="chart-card">
        <div class="chart-tabs-row">
          <span class="chart-tabs-label">图表指标：</span>
          <div class="indicator-tabs" id="chartTabs"></div>
        </div>
        <div class="chart-title" id="chartTitle"></div>
        <div class="chart-canvas-wrap">
          <canvas id="metricChart"></canvas>
        </div>
      </div>

      <div class="footer">
        <button id="downloadBtn" class="primary-btn wide">下载图表 + CSV</button>
      </div>
    </section>

    <section id="emptyHint" class="empty-hint">
      <p>输入股票名称或代码,多个用逗号分隔,例如:<code>贵州茅台,600519</code></p>
    </section>
  </main>
  <div id="siteFooter"></div>

  <script src="js/notif-bar.js?v=20260617-demo"></script>
  <script src="js/app.js"></script>
</body>
</html>
