<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f9d58" />
  <base href="/gp/" />
  <title>景气度选股 · 量化学习助手</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/study.css" />
  <link rel="stylesheet" href="css/invest.css" />
  <link rel="stylesheet" href="css/prosperity-pick.css" />
</head>
<body>
  <header class="top-nav">
    <div class="nav-inner">
      <a href="./" class="brand">
        <span class="brand-mark">🐾</span>
        <span class="brand-name">量化学习助手</span>
      </a>
      <nav class="nav-links">
        <a href="./" class="nav-link">财务分析</a>
        <a href="invest.html" class="nav-link">龙江投资</a>
        <a href="tech-ai.html" class="nav-link">科技AI</a>
        <a href="prosperity-pick.html" class="nav-link active">景气度选股</a>
        <a href="prosperity-strong.html" class="nav-link">强势股选股</a>
        <a href="study.html" class="nav-link">学习搭子</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- Hero -->
    <div class="pp-hero">
      <div class="pp-hero-icon">🔍</div>
      <div>
        <h2 class="pp-hero-title">景气度选股 · AI 全维度个股研究</h2>
        <p class="pp-hero-sub">行业 · 公司 · 估值 · 技术 · 资金，一键生成结构化研报</p>
      </div>
    </div>

    <!-- 输入区 -->
    <div class="pp-search-card">
      <div class="pp-search-row">
        <input id="ppKeyword" type="text" placeholder="输入股票名称或代码，如：三花智控、002050" autocomplete="off" />
        <button id="ppAnalyzeBtn" class="invest-btn">开始分析 ▶</button>
        <button id="ppForceBtn" class="invest-btn-outline" title="强制重新分析（跳过当日缓存）">重新分析</button>
      </div>
      <div class="pp-recent">
        <div class="pp-recent-head">
          <span class="pp-recent-label">近 3 天分析历史</span>
          <span class="pp-recent-note">点击可快速查看缓存结果</span>
        </div>
        <div id="ppRecent" class="pp-recent-list"></div>
      </div>
    </div>

    <!-- 加载态 -->
    <div id="ppLoading" class="pp-loading hidden">
      <div class="pp-loading-spinner"></div>
      <div class="pp-loading-text">正在分析中，请稍候 30~90 秒…</div>
      <div class="pp-loading-steps">
        <div class="pp-step" data-step="0">① 抓取实时数据</div>
        <div class="pp-step" data-step="1">② 行业层分析</div>
        <div class="pp-step" data-step="2">③ 公司层分析</div>
        <div class="pp-step" data-step="3">④ 估值与目标价</div>
        <div class="pp-step" data-step="4">⑤ 技术与资金面</div>
        <div class="pp-step" data-step="5">⑥ 综合总结</div>
      </div>
    </div>

    <!-- 错误提示 -->
    <div id="ppError" class="pp-error hidden"></div>

    <!-- 结果区 -->
    <div id="ppResult" class="pp-result hidden">

      <!-- 公司速览卡 -->
      <div id="ppProfile" class="pp-profile-card"></div>

      <!-- Sticky 锚点导航 -->
      <div class="pp-anchor-nav" id="ppAnchorNav" aria-label="分析章节导航">
        <button type="button" class="pp-anchor active" data-target="pp-section-industry"><span>①</span> 行业</button>
        <button type="button" class="pp-anchor" data-target="pp-section-company"><span>②</span> 公司</button>
        <button type="button" class="pp-anchor" data-target="pp-section-valuation"><span>③</span> 估值</button>
        <button type="button" class="pp-anchor" data-target="pp-section-technical"><span>④</span> 技术</button>
        <button type="button" class="pp-anchor" data-target="pp-section-capital"><span>⑤</span> 资金</button>
        <button type="button" class="pp-anchor" data-target="pp-section-summary"><span>⑥</span> 总结</button>
      </div>

      <!-- ① 行业 -->
      <section id="pp-section-industry" class="pp-section">
        <h3 class="pp-section-title"><span class="pp-section-no">①</span> 行业层面</h3>
        <div id="ppIndustry" class="pp-cards"></div>
      </section>

      <!-- ② 公司 -->
      <section id="pp-section-company" class="pp-section">
        <h3 class="pp-section-title"><span class="pp-section-no">②</span> 公司层面</h3>
        <div id="ppCompany" class="pp-cards"></div>
      </section>

      <!-- ③ 估值 -->
      <section id="pp-section-valuation" class="pp-section">
        <h3 class="pp-section-title"><span class="pp-section-no">③</span> 估值层面</h3>
        <div id="ppValuation" class="pp-valuation"></div>
      </section>

      <!-- ④ 技术 -->
      <section id="pp-section-technical" class="pp-section">
        <h3 class="pp-section-title"><span class="pp-section-no">④</span> 技术层面</h3>
        <div id="ppTechnical" class="pp-tech-card"></div>
      </section>

      <!-- ⑤ 资金 -->
      <section id="pp-section-capital" class="pp-section">
        <h3 class="pp-section-title"><span class="pp-section-no">⑤</span> 资金层面</h3>
        <div id="ppCapital" class="pp-tech-card"></div>
      </section>

      <!-- ⑥ 总结 -->
      <section id="pp-section-summary" class="pp-section">
        <h3 class="pp-section-title"><span class="pp-section-no">⑥</span> 总结</h3>
        <div id="ppSummary" class="pp-summary"></div>
        <div class="pp-infographic-wrap">
          <button id="ppInfographicBtn" class="invest-btn">生成信息图 ✨</button>
          <div id="ppInfographicHint" class="pp-info-hint">点击按钮异步生成可爱卡通风格信息图（需 30~60s）</div>
          <div id="ppInfographic" class="pp-infographic"></div>
        </div>
      </section>

    </div>

  </main>

  <script src="js/prosperity-pick.js"></script>
</body>
</html>
