<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12403a" />
  <base href="/gp/" />
  <title>科技AI · 量化学习助手</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/study.css" />
  <link rel="stylesheet" href="css/invest.css" />
  <link rel="stylesheet" href="css/tech-ai.css" />
</head>
<body>
  <header class="top-nav">
    <div class="nav-inner">
      <a href="./" class="brand">
        <span class="brand-mark">🐾</span>
        <span class="brand-name">量化学习助手</span>
      </a>
      <nav class="nav-links">
        <a href="./" class="nav-link">财务分析</a>
        <a href="invest.html" class="nav-link">龙江投资</a>
        <a href="tech-ai.html" class="nav-link active">科技AI</a>
        <a href="prosperity-pick.html" class="nav-link">景气度选股</a>
        <a href="study.html" class="nav-link">学习搭子</a>
      </nav>
    </div>
  </header>

  <main class="container tech-ai-page">
    <section class="tech-ai-hero">
      <div>
        <div class="tech-ai-kicker">QMT 实时行情监控</div>
        <h2 class="tech-ai-title">科技AI</h2>
        <p class="tech-ai-sub">独立股票池 · 分钟涨跌幅 · 成交量与换手率异动 · Server 酱推送</p>
      </div>
      <div class="tech-ai-hero-actions">
        <button id="refreshBtn" class="invest-btn-outline">刷新</button>
        <button id="runMonitorBtn" class="invest-btn">手动扫描</button>
      </div>
    </section>

    <section class="tech-ai-command">
      <div class="tech-ai-add">
        <input id="stockInput" type="text" placeholder="输入股票代码或名称，如 300733.sz" autocomplete="off" />
        <button id="addStockBtn" class="invest-btn">加入科技AI池</button>
      </div>
      <div class="tech-ai-note">内部代码统一为小写后缀格式；QMT 桥会自动转换为 300733.SZ。</div>
    </section>

    <section class="tech-ai-grid">
      <div class="tech-ai-panel tech-ai-panel-main">
        <div class="tech-ai-panel-head">
          <div>
            <h3>股票池</h3>
            <p>仅展示 <code>pool_type=tech_ai</code> 的标的。</p>
          </div>
          <span id="poolCount" class="tech-ai-pill">0 只</span>
        </div>
        <div id="poolTableWrap" class="tech-ai-table-wrap"></div>
      </div>

      <aside class="tech-ai-panel tech-ai-alert-panel">
        <div class="tech-ai-panel-head">
          <div>
            <h3>最近告警</h3>
            <p>复用 invest_alert 记录。</p>
          </div>
        </div>
        <div id="alertList" class="tech-ai-alert-list"></div>
      </aside>
    </section>
  </main>

  <script src="js/tech-ai.js"></script>
</body>
</html>
