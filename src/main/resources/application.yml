server:
  port: 8080
  servlet:
    context-path: /gp
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: gupiao-quant
  datasource:
    url: jdbc:mysql://43.140.208.165:3306/wucai_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:wmq534@126.com}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # 连接存活检测：MySQL 默认 wait_timeout=8h，设为 28min 提前回收避免服务端断连
      # （设太短会出现 "Connection reset" 误杀；设 28min 既能避开服务端的随机 RST，
      #  又能保证切到 a-stock-data 后真正减少对 MySQL 的依赖）
      max-lifetime: 1700000
      # 空闲连接保活，5min 归还到池
      idle-timeout: 300000
      # keepalive-time：连接池内空闲连接每 60s 发一次心跳，防止被中间链路/LB 静默断连
      keepalive-time: 60000
      # 借出前用 SELECT 1 验证连接是否存活（解决 Connection reset 后拿到死连接的问题）
      connection-test-query: SELECT 1
      # 等待连接超时 20s
      connection-timeout: 20000
      # validation-timeout: SELECT 1 验证最多等 3s（默认5s），避免拖慢请求
      validation-timeout: 3000
      # 池启动时即使连接失败也继续启动（服务能起，DB 恢复后自愈）
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false
  mvc:
    static-path-pattern: /**
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

app:
  upload-dir: uploads
  # PDF 渲染脚本（绝对路径 或 相对项目根目录的路径）；Linux/macOS 各自覆盖
  render-pdf-script: ${RENDER_PDF_SCRIPT:scripts/render_pdf.py}

baostock-sync:
  enabled: true
  startup-enabled: false
  startup-days-back: 45
  daily-days-back: 30
  daily-cron: "0 20 18 * * MON-FRI"
  python-command: python3
  timeout-seconds: 1800

# 个股分析模块 (紫苏叶/高景气九维)
# 多个 API Key 以逗号分隔。生成随机 Key: openssl rand -hex 16
stock-analysis:
  enabled: true
  api-keys: ${STOCK_ANALYSIS_API_KEYS:wmq-gp-secret-2026,wmq-local-debug}
  # 优先用环境变量覆盖，默认走项目内 scripts/baostock_client.py (相对路径以项目根为 CWD)
  python-script: ${BAOSTOCK_CLIENT_SCRIPT:scripts/baostock_client.py}
  python-command: ${BAOSTOCK_CLIENT_PYTHON:python3}
  timeout-seconds: 90

# 产业投研模块 (A-Stock-Data + LLM 读研报 + News Radar 流水线)
industry-research:
  enabled: true
  python-command: python3
  kimi-cli:
    # 兼容旧字段：流水线已不再依赖 kimi CLI；此 enabled 仍作为 "是否启用 LLM" 总开关
    # （控制是否调 MiniMaxClient / minimax CLI 调 LLM 读研报）
    enabled: true
    command: ${KIMI_CLI_COMMAND:kimi}
    max-reports: 1500
    timeout-seconds: 900
    max-report-chars: 50000
    prompt-template: prompts/industry-research-v1.txt
  news-radar:
    enabled: true
    hours: 24
    max-results: 20
  data-fetch:
    timeout-seconds: 30
    fallback-local: true
  pdf-fetch:
    # 自动爬取 + 解析研报 PDF，把真实文本喂给 LLM
    enabled: true
    max-reports: 4
    max-results: 8
    per-report-max-chars: 8000
    max-report-chars: 24000
    download-timeout-seconds: 20
  cli-mode:
    # true=走子进程调 minimax CLI (llm_call.py)；false=走 MiniMaxClient 直连 API
    enabled: false
    script-path: ${user.home}/.mavis/.builtin-skills/llm-call/scripts/llm_call.py
    python-command: python3
    model: minimax-test/MiniMax-M2.7-highspeed
    max-tokens: 8192
    timeout-seconds: 600

prosperity-strong:
  enabled: true
  cron: "0 30 15 * * MON-FRI"
  provider: local
  max-sectors: 5
  leaders-per-sector: 5
  max-candidates: 15
  ai:
    enabled: true
    fallback-to-mock: true
  source:
    sector: eastmoney
    timeout-seconds: 15
  wind:
    skill-dir: ${WIND_SKILL_DIR:${user.home}/.agents/skills/wind-mcp-skill}
    config-path: ${WIND_CONFIG_PATH:${user.home}/.wind-aifinmarket/config}
    timeout-seconds: 15
  tdx:
    enabled: true
    connector-dir: ${TDX_CONNECTOR_DIR:${user.home}/.workbuddy/connectors-marketplace/connectors/tdx-connector}
    # TDX API Key 直调模式（不走 OAuth, 通过 tdx-api-key header 鉴权）
    mcp-url: https://mcp.tdx.com.cn:3001/mcp
    api-key: TDX-c62ebd01bf6634d29f6fb84019f81761

invest-big-yang:
  enabled: true
  startup-enabled: true
  min-streak-days: 1
  max-streak-days: 2
  candidate-lookback-days: 20
  pullback-tolerance-pct: 2.00
  invalid-break-pct: 5.00
  expire-trading-days: 20
  max-signals: 200
  candidate-cron: "0 35 18 * * MON-FRI"
  trigger-cron: "0 */5 9-15 * * MON-FRI"

# 龙江投资股票池后台补全：周末全量 + 每日增量巡检
# refresh-cron  : 全量刷新（拉 BaoStock 日线 + 回填所有池条目）
# backfill-cron : 每日巡检，仅补 NULL 字段，不覆盖手工/OCR/seed 数据
invest-pool:
  refresh-cron: "0 30 20 ? * SAT"
  backfill-cron: "0 30 16 * * ?"

